<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Flight Log</title>
    <style>
        :root {
            --bg: #f5f5f7;
            --card-bg: #ffffff;
            --text: #2c2c2e;
            --text-secondary: #6e6e73;
            --border: #e5e5ea;
            --primary: #2563EB;
            --primary-light: #eef2ff;
            --primary-dark: #1d4ed8;
            --type-self: #2563EB;
            --type-self-light: #eef2ff;
            --type-sex: #dc2626;
            --type-sex-light: #fef2f2;
            --type-wet: #5a9e8c;
            --type-wet-light: #e8f5f0;
            --type-train: #eab308;
            --type-train-light: #fef9c3;
            --danger: #d15252;
            --danger-light: #fef0f0;
            --shadow-sm: 0 1px 3px rgba(0, 0, 0, 0.04);
            --shadow-md: 0 4px 12px rgba(0, 0, 0, 0.06);
            --radius-sm: 10px;
            --radius: 14px;
            --radius-lg: 18px;
            --transition: 0.2s cubic-bezier(0.4, 0, 0.2, 1);
            --font-mono: 'SF Mono', 'Menlo', 'Consolas', 'Courier New', monospace;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif;
            background-color: var(--bg);
            color: var(--text);
            line-height: 1.6;
            min-height: 100vh;
            -webkit-font-smoothing: antialiased;
            padding: 12px;
            padding-bottom: 40px;
        }
        .app-container {
            max-width: 600px;
            margin: 0 auto;
            display: flex;
            flex-direction: column;
            gap: 18px;
        }

        .app-header {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 12px 8px 8px;
            justify-content: center;
            margin-bottom: 4px;
        }
        .app-logo {
            width: 48px;
            height: 48px;
            flex-shrink: 0;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: var(--shadow-md);
        }
        .app-logo svg {
            width: 100%;
            height: 100%;
            display: block;
        }
        .app-title {
            font-size: 2rem;
            font-weight: 700;
            color: var(--text);
            letter-spacing: -0.3px;
        }

        .label-icon {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 20px;
            height: 20px;
            margin-right: 2px;
            vertical-align: middle;
            flex-shrink: 0;
        }
        .label-icon svg {
            width: 16px;
            height: 16px;
            display: block;
        }

        .card {
            background: var(--card-bg);
            border-radius: var(--radius);
            padding: 18px 16px;
            box-shadow: var(--shadow-sm);
            border: 1px solid var(--border);
        }
        .card-title {
            font-size: 0.8rem;
            font-weight: 700;
            color: var(--text-secondary);
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 12px;
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .card-title .dot {
            width: 7px;
            height: 7px;
            border-radius: 50%;
            background: var(--primary);
        }

        .calendar-card {
            background: var(--card-bg);
            border-radius: var(--radius-lg);
            padding: 18px 16px;
            box-shadow: var(--shadow-sm);
            border: 1px solid var(--border);
            text-align: center;
        }
        .calendar-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 14px;
            user-select: none;
        }
        .calendar-month {
            font-weight: 700;
            font-size: 1.1rem;
            color: var(--text);
        }
        .calendar-nav {
            background: none;
            border: none;
            font-size: 1.2rem;
            cursor: pointer;
            padding: 6px 12px;
            border-radius: 8px;
            color: var(--text-secondary);
        }
        .weekdays {
            display: grid;
            grid-template-columns: repeat(7, 1fr);
            font-size: 0.68rem;
            font-weight: 700;
            color: var(--text-secondary);
            margin-bottom: 6px;
        }
        .calendar-grid {
            display: grid;
            grid-template-columns: repeat(7, 1fr);
            gap: 6px;
        }
        .calendar-day {
            aspect-ratio: 1/1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            font-size: 0.85rem;
            font-weight: 500;
            border-radius: 50%;
            cursor: pointer;
            color: var(--text);
            background: transparent;
            font-family: var(--font-mono);
            position: relative;
            padding: 2px 0;
            transition: background 0.15s;
        }
        .calendar-day:hover {
            background: #f0f0f5;
        }
        .calendar-day.other-month {
            color: #ccc;
        }
        .calendar-day.today {
            font-weight: 800;
            color: var(--primary);
            background: var(--primary-light);
        }

        .dot-container {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            align-items: center;
            gap: 3px;
            margin-top: 2px;
            max-width: 80%;
            min-height: 12px;
        }
        .record-dot {
            display: inline-block;
            width: 5px;
            height: 5px;
            border-radius: 50%;
            flex-shrink: 0;
            transition: transform 0.15s;
        }
        .record-dot:hover {
            transform: scale(1.4);
        }

        .form-card {
            background: var(--card-bg);
            border-radius: var(--radius-lg);
            padding: 20px 16px;
            box-shadow: var(--shadow-md);
            border: 1px solid var(--border);
        }
        .form-row {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }
        .form-group {
            display: flex;
            flex-direction: column;
            gap: 5px;
        }
        .form-group label {
            font-size: 0.8rem;
            font-weight: 600;
            color: var(--text-secondary);
            display: flex;
            align-items: center;
            gap: 4px;
        }
        .form-group input,
        .form-group textarea {
            width: 100%;
            padding: 11px 14px;
            border: 1.5px solid var(--border);
            border-radius: var(--radius-sm);
            font-size: 0.95rem;
            background: #fafafa;
            outline: none;
            font-family: var(--font-mono);
        }
        .form-group textarea {
            font-family: inherit;
            resize: vertical;
            min-height: 60px;
        }
        .form-group input:focus,
        .form-group textarea:focus {
            border-color: var(--primary);
            background: #fff;
            box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.1);
        }
        .type-toggle-group {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }
        .type-btn {
            flex: 1;
            min-width: 70px;
            padding: 12px 8px;
            border: 2px solid var(--border);
            border-radius: var(--radius-sm);
            background: #fafafa;
            cursor: pointer;
            font-size: 0.85rem;
            font-weight: 600;
            color: var(--text-secondary);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            transition: all var(--transition);
        }
        .type-btn .type-icon {
            width: 20px;
            height: 20px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
        }
        .type-btn .type-icon svg {
            width: 100%;
            height: 100%;
            stroke: currentColor;
            fill: currentColor;
        }
        .type-btn.selected-self {
            border-color: var(--type-self);
            background: var(--type-self-light);
            color: var(--type-self);
        }
        .type-btn.selected-sex {
            border-color: var(--type-sex);
            background: var(--type-sex-light);
            color: var(--type-sex);
        }
        .type-btn.selected-wet {
            border-color: var(--type-wet);
            background: var(--type-wet-light);
            color: var(--type-wet);
        }
        .type-btn.selected-train {
            border-color: var(--type-train);
            background: var(--type-train-light);
            color: var(--type-train);
        }

        .btn-submit {
            width: 100%;
            padding: 13px;
            background: var(--primary);
            color: #fff;
            border: none;
            border-radius: var(--radius-sm);
            font-weight: 700;
            cursor: pointer;
            margin-top: 14px;
            font-size: 1rem;
        }

        .stats-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
        }
        .stat-card {
            background: var(--card-bg);
            border-radius: var(--radius);
            padding: 14px 12px;
            border: 1px solid var(--border);
            text-align: center;
        }
        .stat-value {
            font-size: 2rem;
            font-weight: 800;
            font-family: var(--font-mono);
            letter-spacing: -0.5px;
        }
        .stat-label {
            font-size: 0.75rem;
            color: var(--text-secondary);
            font-weight: 600;
            margin-top: 2px;
            text-transform: uppercase;
        }
        .stat-detail {
            font-size: 0.7rem;
            color: var(--text-secondary);
            margin-top: 4px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 4px;
            flex-wrap: wrap;
        }
        .stat-detail .mini-icon {
            width: 14px;
            height: 14px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
        }
        .stat-detail .mini-icon svg {
            width: 100%;
            height: 100%;
            stroke: currentColor;
            fill: currentColor;
        }
        .stat-card.accent-blue {
            border-left: 3px solid var(--type-self);
            background: #fafcfd;
        }
        .stat-card.accent-rose {
            border-left: 3px solid var(--type-sex);
            background: #fdfaf9;
        }
        .stat-card.accent-teal {
            border-left: 3px solid var(--type-wet);
            background: #f9fcfa;
        }
        .stat-card.accent-yellow {
            border-left: 3px solid var(--type-train);
            background: var(--type-train-light);
        }
        .stat-value.blue {
            color: var(--type-self);
        }
        .stat-value.rose {
            color: var(--type-sex);
        }
        .stat-value.teal {
            color: var(--type-wet);
        }
        .stat-value.yellow {
            color: var(--type-train);
        }

        .records-card {
            background: var(--card-bg);
            border-radius: var(--radius-lg);
            padding: 16px;
            box-shadow: var(--shadow-sm);
            border: 1px solid var(--border);
        }
        .records-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
        }
        .records-count {
            font-size: 0.8rem;
            color: var(--text-secondary);
            font-weight: 600;
            font-family: var(--font-mono);
        }
        .empty-state {
            text-align: center;
            padding: 36px 16px;
            color: var(--text-secondary);
        }
        .record-item {
            display: flex;
            align-items: flex-start;
            gap: 12px;
            padding: 13px 10px;
            border-bottom: 1px solid #f0f0f3;
            cursor: default;
            user-select: none;
            -webkit-touch-callout: none;
            transition: background 0.2s, transform 0.2s, border-radius 0.2s;
            border-radius: 0;
            position: relative;
            touch-action: manipulation;
        }
        .record-item:last-child {
            border-bottom: none;
        }
        .record-item.long-pressing {
            background: var(--danger-light);
            border-radius: var(--radius-sm);
            transform: scale(0.98);
        }

        .record-type-badge {
            width: 38px;
            height: 38px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.2rem;
            flex-shrink: 0;
        }
        .record-type-badge svg {
            width: 20px;
            height: 20px;
            stroke: currentColor;
            fill: currentColor;
        }
        .badge-self {
            background: var(--type-self-light);
            color: var(--type-self);
        }
        .badge-sex {
            background: var(--type-sex-light);
            color: var(--type-sex);
        }
        .badge-wet {
            background: var(--type-wet-light);
            color: var(--type-wet);
        }
        .badge-train {
            background: var(--type-train-light);
            color: var(--type-train);
        }
        .record-info {
            flex: 1;
            min-width: 0;
        }
        .record-info .record-date {
            font-weight: 700;
            font-size: 0.9rem;
            font-family: var(--font-mono);
        }
        .record-meta {
            font-size: 0.78rem;
            color: var(--text-secondary);
            display: flex;
            gap: 8px;
            align-items: center;
            margin-top: 2px;
            flex-wrap: wrap;
        }

        /* ===== 分页控件 ===== */
        .pagination-container {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            padding: 14px 8px 6px;
            border-top: 1px solid var(--border);
            margin-top: 8px;
            flex-wrap: wrap;
        }
        .page-btn {
            background: none;
            border: 1.5px solid var(--border);
            border-radius: var(--radius-sm);
            padding: 8px 16px;
            font-size: 0.9rem;
            font-weight: 600;
            color: var(--text-secondary);
            cursor: pointer;
            transition: all var(--transition);
            min-width: 48px;
            min-height: 44px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            touch-action: manipulation;
            background: #fff;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
        }
        .page-btn:active {
            transform: scale(0.95);
            background: var(--border);
        }
        .page-btn:disabled {
            opacity: 0.3;
            pointer-events: none;
            transform: none;
        }
        .page-btn:not(:disabled):hover {
            background: var(--primary-light);
            border-color: var(--primary);
            color: var(--primary);
        }
        .page-info {
            font-size: 0.85rem;
            font-weight: 600;
            color: var(--text-secondary);
            font-family: var(--font-mono);
            min-width: 60px;
            text-align: center;
            padding: 0 6px;
        }
        .page-info .current-page {
            color: var(--text);
            font-weight: 800;
        }
        .page-info .total-pages {
            color: var(--text-secondary);
        }

        .chart-card {
            background: var(--card-bg);
            border-radius: var(--radius-lg);
            padding: 16px;
            border: 1px solid var(--border);
        }
        .chart-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 16px;
            flex-wrap: wrap;
            gap: 8px;
        }
        .chart-year-selector {
            display: flex;
            align-items: center;
            gap: 3px;
            font-weight: 700;
            font-family: var(--font-mono);
            flex-wrap: wrap;
            justify-content: flex-end;
        }
        .chart-year-nav {
            background: none;
            border: 1px solid var(--border);
            border-radius: 6px;
            padding: 4px 8px;
            cursor: pointer;
            font-size: 0.8rem;
            color: var(--text-secondary);
            transition: all 0.15s;
            line-height: 1.4;
            min-width: 30px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            touch-action: manipulation;
        }
        .chart-year-nav:active {
            background: var(--border);
        }
        .chart-year-nav.disabled {
            opacity: 0.3;
            pointer-events: none;
        }
        .selector-label {
            font-size: 0.8rem;
            font-weight: 700;
            color: var(--text);
            padding: 0 2px;
            min-width: 44px;
            text-align: center;
        }
        .selector-divider {
            color: var(--border);
            font-weight: 300;
            margin: 0 2px;
            font-size: 0.9rem;
        }
        .half-group {
            display: flex;
            align-items: center;
            gap: 2px;
        }
        .year-group {
            display: flex;
            align-items: center;
            gap: 2px;
        }
        .chart-bars {
            display: flex;
            justify-content: space-around;
            align-items: flex-end;
            height: 180px;
            gap: 4px;
        }
        .chart-month-col {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 3px;
            height: 100%;
            justify-content: flex-end;
        }
        .bar-wrapper {
            display: flex;
            gap: 2px;
            align-items: flex-end;
            height: 140px;
            width: 100%;
            justify-content: center;
        }
        .bar-self,
        .bar-sex,
        .bar-wet,
        .bar-train {
            width: 10px;
            border-radius: 4px 4px 0 0;
            min-height: 2px;
            transition: height 0.25s ease;
        }
        .bar-self {
            background: var(--type-self);
        }
        .bar-sex {
            background: var(--type-sex);
        }
        .bar-wet {
            background: var(--type-wet);
        }
        .bar-train {
            background: var(--type-train);
        }
        .month-label {
            font-size: 0.65rem;
            color: var(--text-secondary);
            font-weight: 600;
            font-family: var(--font-mono);
        }
        .chart-legend {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin-top: 12px;
            font-size: 0.75rem;
            color: var(--text-secondary);
            flex-wrap: wrap;
        }
        .legend-dot {
            display: inline-block;
            width: 10px;
            height: 10px;
            border-radius: 2px;
            margin-right: 4px;
        }

        .actions-row {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
        }
        .btn-action {
            flex: 1;
            padding: 11px 10px;
            border: 1.5px solid var(--border);
            border-radius: var(--radius-sm);
            background: #fff;
            cursor: pointer;
            font-size: 0.8rem;
            font-weight: 600;
            color: var(--text-secondary);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            transition: all var(--transition);
            position: relative;
            overflow: hidden;
            min-height: 52px;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
        }
        .btn-action.danger {
            border-color: #f0d0d0;
            color: #b85c5c;
        }
        .btn-action.primary-outline {
            border-color: var(--primary);
            color: var(--primary);
        }
        .btn-action .action-icon {
            width: 18px;
            height: 18px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
        }
        .btn-action .action-icon svg {
            width: 100%;
            height: 100%;
            stroke: currentColor;
            stroke-width: 2;
            fill: none;
        }
        .btn-action .file-input-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            opacity: 0;
            cursor: pointer;
            font-size: 0;
            padding: 0;
            margin: 0;
            border: none;
            outline: none;
            -webkit-appearance: none;
            appearance: none;
            touch-action: manipulation;
        }
        .btn-action .action-content {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            pointer-events: none;
        }

        .toast {
            position: fixed;
            top: 20px;
            left: 50%;
            transform: translateX(-50%) translateY(-120px);
            background: #333;
            color: #fff;
            padding: 12px 22px;
            border-radius: 24px;
            font-size: 0.85rem;
            z-index: 9999;
            transition: transform 0.35s;
            font-family: var(--font-mono);
            max-width: 90%;
            text-align: center;
            pointer-events: none;
        }
        .toast.show {
            transform: translateX(-50%) translateY(0);
        }

        /* ===== 响应式 ===== */
        @media (min-width: 480px) {
            .form-row {
                flex-direction: row;
                flex-wrap: wrap;
            }
            .stats-grid {
                grid-template-columns: repeat(4, 1fr);
            }
            .bar-self,
            .bar-sex,
            .bar-wet,
            .bar-train {
                width: 14px;
            }
            .dot-container {
                gap: 4px;
            }
            .record-dot {
                width: 6px;
                height: 6px;
            }
            .chart-year-nav {
                padding: 4px 12px;
                font-size: 0.9rem;
            }
            .selector-label {
                font-size: 0.9rem;
                min-width: 52px;
            }
            .page-btn {
                padding: 8px 20px;
                font-size: 1rem;
                min-width: 52px;
                min-height: 48px;
            }
            .page-info {
                font-size: 0.95rem;
                min-width: 70px;
            }
        }

        @media (max-width: 420px) {
            .chart-header {
                flex-direction: column;
                align-items: stretch;
                gap: 6px;
            }
            .chart-year-selector {
                justify-content: center;
            }
            .chart-year-nav {
                padding: 4px 6px;
                font-size: 0.7rem;
                min-width: 26px;
            }
            .selector-label {
                font-size: 0.7rem;
                min-width: 36px;
            }
            .selector-divider {
                margin: 0 1px;
            }
            .half-group,
            .year-group {
                gap: 1px;
            }
            .bar-self,
            .bar-sex,
            .bar-wet,
            .bar-train {
                width: 8px;
            }
            .chart-bars {
                height: 150px;
                gap: 2px;
            }
            .bar-wrapper {
                height: 110px;
                gap: 1px;
            }
            .type-btn {
                font-size: 0.72rem;
                padding: 10px 4px;
                min-width: 56px;
            }
            .type-btn .type-icon {
                width: 16px;
                height: 16px;
            }
            .app-title {
                font-size: 1.6rem;
            }
            .stats-grid {
                grid-template-columns: 1fr 1fr;
                gap: 8px;
            }
            .stat-value {

    <script>
        (function() {
            const STORAGE_KEY = 'personal_records_data';
            const BACKUP_KEY = 'personal_records_backup';

            const toastEl = document.getElementById('toast');
            const recordDateInput = document.getElementById('recordDate');
            const recordDurationInput = document.getElementById('recordDuration');
            const recordNoteInput = document.getElementById('recordNote');
            const typeBtnSelf = document.getElementById('typeBtnSelf');
            const typeBtnSex = document.getElementById('typeBtnSex');
            const typeBtnWet = document.getElementById('typeBtnWet');
            const typeBtnTrain = document.getElementById('typeBtnTrain');
            const recordsListEl = document.getElementById('recordsList');
            const recordsCountLabel = document.getElementById('recordsCountLabel');
            const calendarMonthLabel = document.getElementById('calendarMonthLabel');
            const calendarGrid = document.getElementById('calendarGrid');
            const chartYearLabel = document.getElementById('chartYearLabel');
            const halfYearLabel = document.getElementById('halfYearLabel');
            const chartBarsEl = document.getElementById('chartBars');
            const pageInfoCurrent = document.getElementById('pageCurrent');
            const pageInfoTotal = document.getElementById('pageTotal');
            const prevPageBtn = document.getElementById('prevPageBtn');
            const nextPageBtn = document.getElementById('nextPageBtn');
            const paginationContainer = document.getElementById('paginationContainer');

            let currentType = 'self';
            let calendarYear = new Date().getFullYear();
            let calendarMonth = new Date().getMonth();
            let chartYear = new Date().getFullYear();
            let halfYear = 0; // 0: 1-6月, 1: 7-12月

            // ===== 分页状态 =====
            const PAGE_SIZE = 10;
            let currentPage = 1;

            // ★★★ 图标定义 ★★★
            const selfIconSVG = '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24"><path d="M0 0h24v24H0z" fill="none" /><path fill="currentColor" d="M20.988 12.396L16 9.545V4.75c0-1.93-1.57-3.5-3.5-3.5S9 2.82 9 4.75v4.795l-4.988 2.851a3 3 0 0 0 2.313 5.489L9 17.12v.838l-.874.699a3 3 0 0 0 3.216 5.025c.004-.001.5-.183 1.158-.183l1.158.183a2.998 2.998 0 0 0 3.216-5.025L16 17.958v-.838l2.676.765a2.999 2.999 0 0 0 2.312-5.489m-.566 2.992a1 1 0 0 1-1.196.573L14 14.469v4.451l1.625 1.3a1 1 0 0 1-1.072 1.675c-.008-.004-.824-.395-2.053-.395s-2.045.391-2.053.395a1 1 0 0 1-1.072-1.675L11 18.92v-4.451l-5.226 1.493a1 1 0 0 1-.77-1.829L11 10.706V4.75c0-.827.673-1.5 1.5-1.5s1.5.673 1.5 1.5v5.956l5.996 3.426a1 1 0 0 1 .426 1.256" /><circle cx="12.5" cy="4.5" r=".5" fill="currentColor" /></svg>';

            const sexIconSVG = '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24"><path d="M0 0h24v24H0z" fill="none" /><path fill="currentColor" d="m12.1 18.55l-.1.1l-.11-.1C7.14 14.24 4 11.39 4 8.5C4 6.5 5.5 5 7.5 5c1.54 0 3.04 1 3.57 2.36h1.86C13.46 6 14.96 5 16.5 5c2 0 3.5 1.5 3.5 3.5c0 2.89-3.14 5.74-7.9 10.05M16.5 3c-1.74 0-3.41.81-4.5 2.08C10.91 3.81 9.24 3 7.5 3C4.42 3 2 5.41 2 8.5c0 3.77 3.4 6.86 8.55 11.53L12 21.35l1.45-1.32C18.6 15.36 22 12.27 22 8.5C22 5.41 19.58 3 16.5 3" /></svg>';

            const wetIconSVG = '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24"><path d="M0 0h24v24H0z" fill="none" /><path fill="currentColor" d="m12 3.77l-.75.84S9.97 6.06 8.68 7.94S6 12.07 6 14.23a6 6 0 0 0 6 6a6 6 0 0 0 6-6c0-2.16-1.39-4.41-2.68-6.29s-2.57-3.33-2.57-3.33zm0 3.13c.44.52.84.95 1.68 2.17c1.21 1.76 2.32 4 2.32 5.16c0 2.22-1.78 4-4 4s-4-1.78-4-4c0-1.16 1.11-3.4 2.32-5.16c.84-1.22 1.24-1.65 1.68-2.17" /></svg>';

            const trainIconSVG = '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256"><path d="M0 0h256v256H0z" fill="none" /><path d="M104 192a8 8 0 0 1-8 8H80a8 8 0 0 1 0-16h16a8 8 0 0 1 8 8m72-8h-16a8 8 0 0 0 0 16h16a8 8 0 0 0 0-16m-76-48a12 12 0 1 0-12-12a12 12 0 0 0 12 12m56 0a12 12 0 1 0-12-12a12 12 0 0 0 12 12m88.39-13.88A16 16 0 0 1 232 128h-32v32a40 40 0 0 1-24 72H80a40 40 0 0 1-24-72v-32H24a16 16 0 0 1-15.69-19a56.13 56.13 0 0 1 54.91-45h1.64A55.83 55.83 0 0 1 48 24a8 8 0 0 1 16 0a40 40 0 0 0 40 40h48a40 40 0 0 0 40-40a8 8 0 0 1 16 0a55.83 55.83 0 0 1-16.86 40h1.64a56.13 56.13 0 0 1 54.91 45a15.82 15.82 0 0 1-3.3 13.12M72 152.8a40.6 40.6 0 0 1 8-.8h96a40.6 40.6 0 0 1 8 .8V104a24 24 0 0 0-24-24H96a24 24 0 0 0-24 24ZM56 112v-8a39.8 39.8 0 0 1 8-24h-.8A40.09 40.09 0 0 0 24 112Zm144 80a24 24 0 0 0-24-24H80a24 24 0 0 0 0 48h96a24 24 0 0 0 24-24m32-80a40.08 40.08 0 0 0-39.2-32h-.8a39.8 39.8 0 0 1 8 24v8Z" /></svg>';

            // ===== Toast =====
            function showToast(msg, type = '', duration = 2200) {
                if (window._toastTimer) {
                    clearTimeout(window._toastTimer);
                    window._toastTimer = null;
                }
                toastEl.textContent = msg;
                toastEl.className = 'toast ' + type + ' show';
                if (duration > 0) {
                    window._toastTimer = setTimeout(() => {
                        toastEl.classList.remove('show');
                    }, duration);
                }
            }

            function hideToast() {
                toastEl.classList.remove('show');
                if (window._toastTimer) {
                    clearTimeout(window._toastTimer);
                    window._toastTimer = null;
                }
            }

            // ===== Storage =====
            function loadRecords() {
                try {
                    const raw = localStorage.getItem(STORAGE_KEY);
                    if (!raw) return [];
                    return JSON.parse(raw).filter(r => r && r.date && r.type).map(r => ({ ...r, id: r.id || generateId(),
                        duration: r.duration || 0, note: r.note || '' }));
                } catch (e) { return []; }
            }

            function saveRecords(records) { localStorage.setItem(STORAGE_KEY, JSON.stringify(records)); }

            function generateId() { return 'rec_' + Date.now() + '_' + Math.random().toString(36).substr(2, 6); }

            // ===== Type selection =====
            window.selectType = function(type) {
                currentType = type;
                typeBtnSelf.className = type === 'self' ? 'type-btn selected-self' : 'type-btn';
                typeBtnSex.className = type === 'sex' ? 'type-btn selected-sex' : 'type-btn';
                typeBtnWet.className = type === 'wet' ? 'type-btn selected-wet' : 'type-btn';
                typeBtnTrain.className = type === 'train' ? 'type-btn selected-train' : 'type-btn';
            };

            // ===== Add record =====
            window.addRecord = function() {
                const date = recordDateInput.value.trim();
                const rawDuration = recordDurationInput.value.trim();
                const note = recordNoteInput.value.trim();
                if (!date) return showToast('请选择日期', 'warning');

                let duration = 0;
                if (rawDuration !== '') {
                    const parsed = parseInt(rawDuration, 10);
                    if (isNaN(parsed) || parsed < 0) return showToast('时长请输入有效数字', 'warning');
                    if (parsed > 480) return showToast('时长不能超过480分钟', 'warning');
                    duration = parsed;
                }

                const record = { id: generateId(), date, type: currentType, duration, note, createdAt: new Date()
                        .toISOString() };
                const records = loadRecords();
                records.push(record);
                records.sort((a, b) => b.date.localeCompare(a.date) || (b.createdAt || '').localeCompare(a.createdAt || ''));
                saveRecords(records);
                resetForm();
                resetPagination();
                renderAll();
                showToast(`✅ 已记录：${date}`, 'success');
            };

            function resetForm() {
                const today = new Date().toISOString().split('T')[0];
                recordDateInput.value = today;
                recordDateInput.max = today;
                recordDurationInput.value = '';
                recordNoteInput.value = '';
                currentType = 'self';
                typeBtnSelf.className = 'type-btn selected-self';
                typeBtnSex.className = 'type-btn';
                typeBtnWet.className = 'type-btn';
                typeBtnTrain.className = 'type-btn';
            }

            // ===== 分页核心函数 =====
            function resetPagination() {
                currentPage = 1;
            }

            function getTotalPages(totalRecords) {
                return Math.max(1, Math.ceil(totalRecords / PAGE_SIZE));
            }

            function getPageData(records, page) {
                const start = (page - 1) * PAGE_SIZE;
                const end = start + PAGE_SIZE;
                return records.slice(start, end);
            }

            // 翻页函数（闭包内部使用，不暴露到 window）
            function goToPage(page) {
                const records = loadRecords();
                const totalPages = getTotalPages(records.length);
                if (page < 1 || page > totalPages) return;
                currentPage = page;
                renderAll();
                // 滚动到记录列表区域
                const card = document.querySelector('.records-card');
                if (card) {
                    card.scrollIntoView({ behavior: 'smooth', block: 'start' });
                }
            }

            // ===== 事件委托：分页按钮点击 =====
            paginationContainer.addEventListener('click', function(e) {
                const target = e.target.closest('button');
                if (!target) return;
                if (target.id === 'prevPageBtn') {
                    goToPage(currentPage - 1);
                } else if (target.id === 'nextPageBtn') {
                    goToPage(currentPage + 1);
                }
            });

            // ===== Delete =====
            window.deleteRecord = function(id, skipConfirm = false) {
                if (!skipConfirm && !confirm('确定删除这条记录吗？')) return;
                const records = loadRecords();
                const filtered = records.filter(r => r.id !== id);
                if (filtered.length === records.length) {
                    showToast('记录不存在', 'warning');
                    return;
                }
                saveRecords(filtered);
                // 如果当前页没有数据了，且不是第一页，则回退一页
                const totalPages = getTotalPages(filtered.length);
                if (currentPage > totalPages && currentPage > 1) {
                    currentPage = totalPages;
                }
                renderAll();
                showToast('🗑️ 记录已删除', 'success');
            };

            // ===== Clear all =====
            window.clearAllRecords = function() {
                const records = loadRecords();
                if (!records.length) return showToast('没有记录可清空');
                if (!confirm(`清空全部 ${records.length} 条记录？此操作不可恢复。`)) return;
                if (!confirm('再次确认清空？')) return;
                localStorage.setItem(BACKUP_KEY, JSON.stringify(records));
                saveRecords([]);
                resetPagination();
                renderAll();
                showToast('已清空（已自动备份）', 'warning');
            };

            // ===== Export / Import =====
            window.exportData = function() {
                const records = loadRecords();
                if (!records.length) return showToast('无记录可导出');
                const blob = new Blob([JSON.stringify(records, null, 2)], { type: 'application/json' });
                const url = URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = url;
                a.download = `backup_${new Date().toISOString().split('T')[0]}.json`;
                document.body.appendChild(a);
                a.click();
                document.body.removeChild(a);
                URL.revokeObjectURL(url);
                showToast(`📤 已导出 ${records.length} 条记录`, 'success');
            };

            window.importData = function(e) {
                const file = e.target.files[0];
                e.target.value = '';
                if (!file) return;
                const reader = new FileReader();
                reader.onload = function(ev) {
                    try {
                        const data = JSON.parse(ev.target.result);
                        if (!Array.isArray(data)) throw new Error('格式错误');
                        const valid = data.filter(r => r && r.date && r.type).map(r => ({ id: r.id || generateId(),
                            date: r.date, type: r.type, duration: parseInt(r.duration) || 0, note: r.note || '',
                            createdAt: r.createdAt || new Date().toISOString() }));
                        if (!valid.length) return showToast('无有效记录', 'warning');
                        if (!confirm(`导入 ${valid.length} 条记录？当前数据将被替换。`)) return;
                        const old = loadRecords();
                        if (old.length) localStorage.setItem(BACKUP_KEY, JSON.stringify(old));
                        valid.sort((a, b) => b.date.localeCompare(a.date));
                        saveRecords(valid);
                        resetPagination();
                        renderAll();
                        showToast(`📥 已导入 ${valid.length} 条记录`, 'success');
                    } catch (err) {
                        showToast('文件解析失败: ' + err.message, 'error');
                    }
                };
                reader.readAsText(file);
            };

            // ===== Stats =====
            function calculateStats(records) {
                const now = new Date();
                const y = now.getFullYear();
                const m = now.getMonth();
                const cmStr = `${y}-${String(m+1).padStart(2,'0')}`;
                let mSelf = 0,
                    mSex = 0,
                    mWet = 0;
                let ySelf = 0,
                    ySex = 0,
                    yWet = 0;
                const yearMonths = new Set();
                records.forEach(r => {
                    const [year, month] = r.date.split('-');
                    if (r.type !== 'train') {
                        yearMonths.add(`${year}-${month}`);
                    }
                    if (r.type === 'self') {
                        if (`${year}-${month}` === cmStr) mSelf++;
                        if (year === String(y)) ySelf++;
                    } else if (r.type === 'sex') {
                        if (`${year}-${month}` === cmStr) mSex++;
                        if (year === String(y)) ySex++;
                    } else if (r.type === 'wet') {
                        if (`${year}-${month}` === cmStr) mWet++;
                        if (year === String(y)) yWet++;
                    }
                });
                const totalAll = records.filter(r => r.type !== 'train').length;
                const active = yearMonths.size;
                return {
                    monthSelf: mSelf,
                    monthSex: mSex,
                    monthWet: mWet,
                    monthTotal: mSelf + mSex + mWet,
                    yearSelf: ySelf,
                    yearSex: ySex,
                    yearWet: yWet,
                    yearTotal: ySelf + ySex + yWet,
                    totalAll: totalAll,
                    avgMonthly: active ? (totalAll / active).toFixed(1) : 0,
                    activeMonths: active
                };
            }

            function renderStats(s) {
                document.getElementById('statMonthTotal').textContent = s.monthTotal;
                document.getElementById('statMonthDetail').innerHTML =
                    `<span class="mini-icon" style="color:var(--type-self)">${selfIconSVG}</span> ${s.monthSelf} · ` +
                    `<span class="mini-icon" style="color:var(--type-sex)">${sexIconSVG}</span> ${s.monthSex} · ` +
                    `<span class="mini-icon" style="color:var(--type-wet)">${wetIconSVG}</span> ${s.monthWet}`;

                document.getElementById('statYearTotal').textContent = s.yearTotal;
                document.getElementById('statYearDetail').innerHTML =
                    `<span class="mini-icon" style="color:var(--type-self)">${selfIconSVG}</span> ${s.yearSelf} · ` +
                    `<span class="mini-icon" style="color:var(--type-sex)">${sexIconSVG}</span> ${s.yearSex} · ` +
                    `<span class="mini-icon" style="color:var(--type-wet)">${wetIconSVG}</span> ${s.yearWet}`;

                document.getElementById('statAvgMonthly').textContent = s.avgMonthly;
                document.getElementById('statAvgDetail').textContent = `活跃月份 ${s.activeMonths}`;
                document.getElementById('statTotalAll').textContent = s.totalAll;
                document.getElementById('statTotalDetail').textContent = `全部合计`;
            }

            // ===== Helpers =====
            function getWeekday(d) { return ['周日', '周一', '周二', '周三', '周四', '周五', '周六'][new Date(d + 'T00:00:00')
                    .getDay()] || ''; }

            function escapeHtml(s) { const div = document.createElement('div');
                div.textContent = s; return div.innerHTML; }

            // ===== Calendar =====
            function renderCalendar() {
                const records = loadRecords();
                const dateCount = {
                    self: {},
                    sex: {},
                    wet: {},
                    train: {}
                };
                records.forEach(r => {
                    if (r.type === 'self') dateCount.self[r.date] = (dateCount.self[r.date] || 0) + 1;
                    else if (r.type === 'sex') dateCount.sex[r.date] = (dateCount.sex[r.date] || 0) + 1;
                    else if (r.type === 'wet') dateCount.wet[r.date] = (dateCount.wet[r.date] || 0) + 1;
                    else if (r.type === 'train') dateCount.train[r.date] = (dateCount.train[r.date] || 0) + 1;
                });

                const year = calendarYear,
                    month = calendarMonth;
                const firstDay = new Date(year, month, 1);
                const startDow = (firstDay.getDay() + 6) % 7;
                const daysInMonth = new Date(year, month + 1, 0).getDate();
                const daysInPrev = new Date(year, month, 0).getDate();
                calendarMonthLabel.textContent = `${year}年${month+1}月`;
                let html = '';
                for (let i = startDow - 1; i >= 0; i--) {
                    const prevDate = new Date(year, month - 1, daysInPrev - i);
                    const dateStr = prevDate.toISOString().split('T')[0];
                    html += `<div class="calendar-day other-month" onclick="setDate('${dateStr}')">${daysInPrev - i}</div>`;
                }
                const todayStr = new Date().toISOString().split('T')[0];

                const typeColors = {
                    self: 'var(--type-self)',
                    sex: 'var(--type-sex)',
                    wet: 'var(--type-wet)',
                    train: 'var(--type-train)'
                };

                for (let d = 1; d <= daysInMonth; d++) {
                    const dateStr =
                        `${year}-${String(month+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
                    const selfCount = dateCount.self[dateStr] || 0;
                    const sexCount = dateCount.sex[dateStr] || 0;
                    const wetCount = dateCount.wet[dateStr] || 0;
                    const trainCount = dateCount.train[dateStr] || 0;

                    let cls = 'calendar-day';
                    if (dateStr === todayStr) cls += ' today';

                    let dotHtml = '';
                    const groups = [
                        { type: 'self', count: Math.min(selfCount, 5) },
                        { type: 'sex', count: Math.min(sexCount, 5) },
                        { type: 'wet', count: Math.min(wetCount, 5) },
                        { type: 'train', count: Math.min(trainCount, 5) }
                    ];
                    const totalDots = groups.reduce((s, g) => s + g.count, 0);
                    if (totalDots > 0) {
                        let dotsMarkup = '';
                        groups.forEach(g => {
                            if (g.count === 0) return;
                            const color = typeColors[g.type];
                            for (let i = 0; i < g.count; i++) {
                                dotsMarkup += `<span class="record-dot" style="background:${color};"></span>`;
                            }
                        });
                        dotHtml = `<div class="dot-container">${dotsMarkup}</div>`;
                    }

                    html += `<div class="${cls}" onclick="setDate('${dateStr}')">${d}${dotHtml}</div>`;
                }
                const rem = (7 - (startDow + daysInMonth) % 7) % 7;
                for (let d = 1; d <= rem; d++) {
                    const nextDate = new Date(year, month + 1, d);
                    const dateStr = nextDate.toISOString().split('T')[0];
                    html += `<div class="calendar-day other-month" onclick="setDate('${dateStr}')">${d}</div>`;
                }
                calendarGrid.innerHTML = html;
            }

            window.changeMonth = function(delta) {
                calendarMonth += delta;
                if (calendarMonth < 0) { calendarMonth = 11;
                    calendarYear--; } else if (calendarMonth > 11) { calendarMonth = 0;
                    calendarYear++; }
                renderCalendar();
            };

            window.setDate = function(dateStr) {
                recordDateInput.value = dateStr;
                document.querySelector('.form-card').scrollIntoView({ behavior: 'smooth' });
            };

            // ===== Chart =====
            function renderChart() {
                const records = loadRecords();
                const year = chartYear;
                chartYearLabel.textContent = year;

                const startMonth = halfYear === 0 ? 1 : 7;
                const endMonth = halfYear === 0 ? 6 : 12;
                halfYearLabel.textContent = halfYear === 0 ? '1-6月' : '7-12月';

                const prevBtn = document.getElementById('halfPrevBtn');
                const nextBtn = document.getElementById('halfNextBtn');
                if (prevBtn) prevBtn.classList.toggle('disabled', halfYear === 0);
                if (nextBtn) nextBtn.classList.toggle('disabled', halfYear === 1);

                const months = [];
                for (let m = startMonth; m <= endMonth; m++) {
                    months.push({ month: m, self: 0, sex: 0, wet: 0, train: 0 });
                }

                records.forEach(r => {
                    const [y, m] = r.date.split('-').map(Number);
                    if (y === year && m >= startMonth && m <= endMonth) {
                        const idx = m - startMonth;
                        if (r.type === 'self') months[idx].self++;
                        else if (r.type === 'sex') months[idx].sex++;
                        else if (r.type === 'wet') months[idx].wet++;
                        else if (r.type === 'train') months[idx].train++;
                    }
                });

                const maxVal = Math.max(1, ...months.map(m => m.self + m.sex + m.wet + m.train));
                let html = '';
                months.forEach(m => {
                    const selfH = (m.self / maxVal) * 130;
                    const sexH = (m.sex / maxVal) * 130;
                    const wetH = (m.wet / maxVal) * 130;
                    const trainH = (m.train / maxVal) * 130;
                    html +=
                        `<div class="chart-month-col"><div class="bar-wrapper"><div class="bar-self" style="height:${selfH}px"></div><div class="bar-sex" style="height:${sexH}px"></div><div class="bar-wet" style="height:${wetH}px"></div><div class="bar-train" style="height:${trainH}px"></div></div><div class="month-label">${m.month}月</div></div>`;
                });
                chartBarsEl.innerHTML = html;
            }

            window.changeHalfYear = function(delta) {
                const newHalf = halfYear + delta;
                if (newHalf >= 0 && newHalf <= 1) {
                    halfYear = newHalf;
                    renderChart();
                }
            };

            window.changeChartYear = function(delta) {
                chartYear += delta;
                renderChart();
            };

            // ===== 长按删除 =====
            function bindLongPress(element) {
                let timer = null;
                let isPressing = false;
                const id = element.dataset.id;
                if (!id) return;

                function startPress(e) {
                    if (e.type === 'mousedown' && e.button !== 0) return;
                    if (isPressing) return;

                    isPressing = true;
                    element.classList.add('long-pressing');

                    showToast('继续长按 5 秒删除', 'info', 0);
                    toastEl.classList.add('show');

                    timer = setTimeout(() => {
                        if (isPressing) {
                            window.deleteRecord(id, true);
                            isPressing = false;
                            timer = null;
                            hideToast();
                        }
                    }, 5000);
                }

                function cancelPress(e) {
                    if (timer) {
                        clearTimeout(timer);
                        timer = null;
                    }
                    if (isPressing) {
                        isPressing = false;
                        element.classList.remove('long-pressing');
                        hideToast();
                    }
                }

                element.addEventListener('touchstart', startPress, { passive: true });
                element.addEventListener('touchend', cancelPress, { passive: true });
                element.addEventListener('touchcancel', cancelPress, { passive: true });
                element.addEventListener('touchmove', cancelPress, { passive: true });

                element.addEventListener('mousedown', startPress);
                element.addEventListener('mouseup', cancelPress);
                element.addEventListener('mouseleave', cancelPress);
                element.addEventListener('mousemove', function(e) {
                    if (isPressing) {
                        const rect = element.getBoundingClientRect();
                        const x = e.clientX,
                            y = e.clientY;
                        if (x < rect.left || x > rect.right || y < rect.top || y > rect.bottom) {
                            cancelPress(e);
                        }
                    }
                });
            }

            // ===== Render records list (分页) =====
            function renderRecordsList(records, totalCount) {
                recordsCountLabel.textContent = `共 ${totalCount} 条`;

                if (!records.length) {
                    recordsListEl.innerHTML = '<div class="empty-state">📭<p>暂无记录</p></div>';
                    return;
                }

                let html = '';
                records.forEach(r => {
                    const isSelf = r.type === 'self';
                    const isSex = r.type === 'sex';
                    const isWet = r.type === 'wet';
                    const isTrain = r.type === 'train';
                    let badgeClass = 'badge-self';
                    let label = '自慰';
                    let icon = selfIconSVG;
                    if (isSex) { badgeClass = 'badge-sex';
                        label = '性交';
                        icon = sexIconSVG; } else if (isWet) { badgeClass = 'badge-wet';
                        label = '遗精';
                        icon = wetIconSVG; } else if (isTrain) { badgeClass = 'badge-train';
                        label = '牛牛训练';
                        icon = trainIconSVG; }

                    const durationDisplay = r.duration > 0 ? `${r.duration} 分钟` : '';

                    html += `<div class="record-item" data-id="${r.id}">
                        <div class="record-type-badge ${badgeClass}">${icon}</div>
                        <div class="record-info">
                            <div class="record-date">${r.date} ${getWeekday(r.date)}</div>
                            <div class="record-meta">
                                <span>${label}</span>
                                ${durationDisplay ? `<span>${durationDisplay}</span>` : ''}
                            </div>
                            ${r.note ? `<div style="font-size:0.8rem;color:#555;">💬 ${escapeHtml(r.note)}</div>` : ''}
                        </div>
                    </div>`;
                });
                recordsListEl.innerHTML = html;

                document.querySelectorAll('.record-item').forEach(el => {
                    bindLongPress(el);
                });
            }

            // ===== 渲染分页控件 =====
            function renderPagination(totalRecords) {
                const totalPages = getTotalPages(totalRecords);
                const current = Math.min(currentPage, totalPages);

                // 更新页码显示
                pageInfoCurrent.textContent = current;
                pageInfoTotal.textContent = totalPages;

                // 更新按钮状态
                prevPageBtn.disabled = current <= 1;
                nextPageBtn.disabled = current >= totalPages;

                // 如果总记录数为0，隐藏分页控件
                if (totalRecords === 0) {
                    paginationContainer.style.display = 'none';
                } else {
                    paginationContainer.style.display = 'flex';
                }
            }

            // ===== Render all =====
            function renderAll() {
                const records = loadRecords();
                const totalRecords = records.length;
                const totalPages = getTotalPages(totalRecords);

                // 修正当前页
                if (currentPage > totalPages) currentPage = Math.max(1, totalPages);
                if (currentPage < 1) currentPage = 1;

                // 获取当前页数据
                const pageRecords = getPageData(records, currentPage);

                renderStats(calculateStats(records));
                renderRecordsList(pageRecords, totalRecords);
                renderPagination(totalRecords);
                renderCalendar();
                renderChart();
            }

            // ===== Init =====
            function init() {
                const today = new Date().toISOString().split('T')[0];
                recordDateInput.value = today;
                recordDateInput.max = today;
                calendarYear = new Date().getFullYear();
                calendarMonth = new Date().getMonth();
                chartYear = new Date().getFullYear();

                const currentMonth = new Date().getMonth() + 1;
                halfYear = currentMonth <= 6 ? 0 : 1;

                resetPagination();
                renderAll();
            }

            init();
        })();
    </script>
</body>
</html>
