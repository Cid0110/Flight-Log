<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Flight Log</title>
    <style>
        :root {
            --bg: #f5f5f7;
            --card-bg: #ffffff;
            --text: #2c2c2e;
            --text-secondary: #6e6e73;
            --border: #e5e5ea;
            --primary: #2563EB;
            --primary-light: #eef2ff;
            --primary-dark: #1d4ed8;
            --type-self: #2563EB;
            --type-self-light: #eef2ff;
            --type-sex: #dc2626;
            --type-sex-light: #fef2f2;
            --danger: #d15252;
            --danger-light: #fef0f0;
            --shadow-sm: 0 1px 3px rgba(0, 0, 0, 0.04);
            --shadow-md: 0 4px 12px rgba(0, 0, 0, 0.06);
            --radius-sm: 10px;
            --radius: 14px;
            --radius-lg: 18px;
            --transition: 0.2s cubic-bezier(0.4, 0, 0.2, 1);
            --font-mono: 'SF Mono', 'Menlo', 'Consolas', 'Courier New', monospace;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif;
            background-color: var(--bg);
            color: var(--text);
            line-height: 1.6;
            min-height: 100vh;
            -webkit-font-smoothing: antialiased;
            padding: 12px;
            padding-bottom: 40px;
        }
        .app-container {
            max-width: 600px;
            margin: 0 auto;
            display: flex;
            flex-direction: column;
            gap: 18px;
        }

        .app-header {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 12px 8px 8px;
            justify-content: center;
            margin-bottom: 4px;
        }
        .app-logo {
            width: 48px;
            height: 48px;
            flex-shrink: 0;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: var(--shadow-md);
        }
        .app-logo svg {
            width: 100%;
            height: 100%;
            display: block;
        }
        .app-title {
            font-size: 2rem;
            font-weight: 700;
            color: var(--text);
            letter-spacing: -0.3px;
        }

        .label-icon {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 20px;
            height: 20px;
            margin-right: 2px;
            vertical-align: middle;
            flex-shrink: 0;
        }
        .label-icon svg {
            width: 16px;
            height: 16px;
            display: block;
        }

        .card {
            background: var(--card-bg);
            border-radius: var(--radius);
            padding: 18px 16px;
            box-shadow: var(--shadow-sm);
            border: 1px solid var(--border);
        }
        .card-title {
            font-size: 0.8rem;
            font-weight: 700;
            color: var(--text-secondary);
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 12px;
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .card-title .dot {
            width: 7px;
            height: 7px;
            border-radius: 50%;
            background: var(--primary);
        }

        .calendar-card {
            background: var(--card-bg);
            border-radius: var(--radius-lg);
            padding: 18px 16px;
            box-shadow: var(--shadow-sm);
            border: 1px solid var(--border);
            text-align: center;
        }
        .calendar-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 14px;
            user-select: none;
        }
        .calendar-month {
            font-weight: 700;
            font-size: 1.1rem;
            color: var(--text);
        }
        .calendar-nav {
            background: none;
            border: none;
            font-size: 1.2rem;
            cursor: pointer;
            padding: 6px 12px;
            border-radius: 8px;
            color: var(--text-secondary);
        }
        .weekdays {
            display: grid;
            grid-template-columns: repeat(7, 1fr);
            font-size: 0.68rem;
            font-weight: 700;
            color: var(--text-secondary);
            margin-bottom: 6px;
        }
        .calendar-grid {
            display: grid;
            grid-template-columns: repeat(7, 1fr);
            gap: 6px;
        }
        .calendar-day {
            aspect-ratio: 1/1;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 0.85rem;
            font-weight: 500;
            border-radius: 50%;
            cursor: default;
            color: var(--text);
            background: transparent;
            font-family: var(--font-mono);
        }
        .calendar-day.other-month {
            color: #ccc;
        }
        .calendar-day.today {
            font-weight: 800;
            color: var(--primary);
            background: var(--primary-light);
        }
        .calendar-day.has-record {
            background: var(--primary);
            color: white;
            font-weight: 700;
        }
        .calendar-day.has-record.today {
            border: 2px solid var(--primary-dark);
        }

        .form-card {
            background: var(--card-bg);
            border-radius: var(--radius-lg);
            padding: 20px 16px;
            box-shadow: var(--shadow-md);
            border: 1px solid var(--border);
        }
        .form-row {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }
        .form-group {
            display: flex;
            flex-direction: column;
            gap: 5px;
        }
        .form-group label {
            font-size: 0.8rem;
            font-weight: 600;
            color: var(--text-secondary);
            display: flex;
            align-items: center;
            gap: 4px;
        }
        .form-group input,
        .form-group textarea {
            width: 100%;
            padding: 11px 14px;
            border: 1.5px solid var(--border);
            border-radius: var(--radius-sm);
            font-size: 0.95rem;
            background: #fafafa;
            outline: none;
            font-family: var(--font-mono);
        }
        .form-group textarea {
            font-family: inherit;
            resize: vertical;
            min-height: 60px;
        }
        .form-group input:focus,
        .form-group textarea:focus {
            border-color: var(--primary);
            background: #fff;
            box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.1);
        }
        .type-toggle-group {
            display: flex;
            gap: 10px;
        }
        .type-btn {
            flex: 1;
            padding: 12px 10px;
            border: 2px solid var(--border);
            border-radius: var(--radius-sm);
            background: #fafafa;
            cursor: pointer;
            font-size: 0.9rem;
            font-weight: 600;
            color: var(--text-secondary);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            transition: all var(--transition);
        }
        .type-btn .type-icon {
            width: 20px;
            height: 20px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
        }
        .type-btn .type-icon svg {
            width: 100%;
            height: 100%;
            stroke: currentColor;
        }
        .type-btn.selected-self {
            border-color: var(--type-self);
            background: var(--type-self-light);
            color: var(--type-self);
        }
        .type-btn.selected-sex {
            border-color: var(--type-sex);
            background: var(--type-sex-light);
            color: var(--type-sex);
        }

        .btn-submit {
            width: 100%;
            padding: 13px;
            background: var(--primary);
            color: #fff;
            border: none;
            border-radius: var(--radius-sm);
            font-weight: 700;
            cursor: pointer;
            margin-top: 14px;
            font-size: 1rem;
        }

        .stats-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
        }
        .stat-card {
            background: var(--card-bg);
            border-radius: var(--radius);
            padding: 14px 12px;
            border: 1px solid var(--border);
            text-align: center;
        }
        .stat-value {
            font-size: 2rem;
            font-weight: 800;
            font-family: var(--font-mono);
            letter-spacing: -0.5px;
        }
        .stat-label {
            font-size: 0.75rem;
            color: var(--text-secondary);
            font-weight: 600;
            margin-top: 2px;
            text-transform: uppercase;
        }
        .stat-detail {
            font-size: 0.7rem;
            color: var(--text-secondary);
            margin-top: 4px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 4px;
        }
        .stat-detail .mini-icon {
            width: 14px;
            height: 14px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
        }
        .stat-detail .mini-icon svg {
            width: 100%;
            height: 100%;
            stroke: currentColor;
        }
        .stat-card.accent-blue {
            border-left: 3px solid var(--type-self);
            background: #fafcfd;
        }
        .stat-card.accent-rose {
            border-left: 3px solid var(--type-sex);
            background: #fdfaf9;
        }
        .stat-card.accent-teal {
            border-left: 3px solid #5a9e8c;
            background: #f9fcfa;
        }
        .stat-card.accent-purple {
            border-left: 3px solid #8b7db8;
            background: #fbfafd;
        }
        .stat-value.blue {
            color: var(--type-self);
        }
        .stat-value.rose {
            color: var(--type-sex);
        }
        .stat-value.teal {
            color: #5a9e8c;
        }
        .stat-value.purple {
            color: #8b7db8;
        }

        .records-card {
            background: var(--card-bg);
            border-radius: var(--radius-lg);
            padding: 16px;
            box-shadow: var(--shadow-sm);
            border: 1px solid var(--border);
        }
        .records-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
        }
        .records-count {
            font-size: 0.8rem;
            color: var(--text-secondary);
            font-weight: 600;
            font-family: var(--font-mono);
        }
        .empty-state {
            text-align: center;
            padding: 36px 16px;
            color: var(--text-secondary);
        }
        .record-item {
            display: flex;
            align-items: flex-start;
            gap: 12px;
            padding: 13px 10px;
            border-bottom: 1px solid #f0f0f3;
        }
        .record-item:last-child {
            border-bottom: none;
        }
        .record-type-badge {
            width: 38px;
            height: 38px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.2rem;
        }
        .record-type-badge svg {
            width: 20px;
            height: 20px;
            stroke: currentColor;
        }
        .badge-self {
            background: var(--type-self-light);
            color: var(--type-self);
        }
        .badge-sex {
            background: var(--type-sex-light);
            color: var(--type-sex);
        }
        .record-info .record-date {
            font-weight: 700;
            font-size: 0.9rem;
            font-family: var(--font-mono);
        }
        .record-meta {
            font-size: 0.78rem;
            color: var(--text-secondary);
            display: flex;
            gap: 8px;
            align-items: center;
            margin-top: 2px;
        }
        .btn-delete {
            background: none;
            border: none;
            font-size: 1.1rem;
            color: #bbb;
            padding: 6px;
            cursor: pointer;
        }

        .chart-card {
            background: var(--card-bg);
            border-radius: var(--radius-lg);
            padding: 16px;
            border: 1px solid var(--border);
        }
        .chart-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 16px;
        }
        .chart-year-selector {
            display: flex;
            align-items: center;
            gap: 8px;
            font-weight: 700;
            font-family: var(--font-mono);
        }
        .chart-year-nav {
            background: none;
            border: 1px solid var(--border);
            border-radius: 6px;
            padding: 4px 10px;
            cursor: pointer;
        }
        .chart-bars {
            display: flex;
            justify-content: space-around;
            align-items: flex-end;
            height: 180px;
            gap: 4px;
        }
        .chart-month-col {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 3px;
            height: 100%;
            justify-content: flex-end;
        }
        .bar-wrapper {
            display: flex;
            gap: 2px;
            align-items: flex-end;
            height: 140px;
            width: 100%;
            justify-content: center;
        }
        .bar-self,
        .bar-sex {
            width: 8px;
            border-radius: 4px 4px 0 0;
            min-height: 2px;
        }
        .bar-self {
            background: var(--type-self);
        }
        .bar-sex {
            background: var(--type-sex);
        }
        .month-label {
            font-size: 0.65rem;
            color: var(--text-secondary);
            font-weight: 600;
            font-family: var(--font-mono);
        }
        .chart-legend {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin-top: 12px;
            font-size: 0.75rem;
            color: var(--text-secondary);
        }
        .legend-dot {
            display: inline-block;
            width: 10px;
            height: 10px;
            border-radius: 2px;
            margin-right: 4px;
        }

        .actions-row {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
        }
        .btn-action {
            flex: 1;
            padding: 11px 10px;
            border: 1.5px solid var(--border);
            border-radius: var(--radius-sm);
            background: #fff;
            cursor: pointer;
            font-size: 0.8rem;
            font-weight: 600;
            color: var(--text-secondary);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            transition: all var(--transition);
        }
        .btn-action.danger {
            border-color: #f0d0d0;
            color: #b85c5c;
        }
        .btn-action.primary-outline {
            border-color: var(--primary);
            color: var(--primary);
        }
        .btn-action .action-icon {
            width: 18px;
            height: 18px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
        }
        .btn-action .action-icon svg {
            width: 100%;
            height: 100%;
            stroke: currentColor;
        }

        .toast {
            position: fixed;
            top: 20px;
            left: 50%;
            transform: translateX(-50%) translateY(-120px);
            background: #333;
            color: #fff;
            padding: 12px 22px;
            border-radius: 24px;
            font-size: 0.85rem;
            z-index: 9999;
            transition: transform 0.35s;
            font-family: var(--font-mono);
        }
        .toast.show {
            transform: translateX(-50%) translateY(0);
        }
        #importFileInput {
            display: none;
        }

        @media (min-width: 480px) {
            .form-row {
                flex-direction: row;
                flex-wrap: wrap;
            }
            .stats-grid {
                grid-template-columns: repeat(4, 1fr);
            }
            .bar-self,
            .bar-sex {
                width: 12px;
            }
        }
    </style>
</head>
<body>
    <div class="toast" id="toast"></div>

    <div class="app-container">
        <!-- 头部：原始APP图标 -->
        <header class="app-header">
            <div class="app-logo">
                <svg viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg">
                    <rect width="512" height="512" rx="100" fill="#2563EB" />
                    <g transform="translate(256, 256)">
                        <path d="M-160,-20 L-120,-40 L80,-40 L120,-20 L160,0 L120,20 L80,40 L-120,40 L-160,20 Z" fill="white" />
                        <path d="M-100,-18 L-70,-18 L-70,18 L-100,18 Z" fill="#2563EB" />
                        <path d="M-160,-20 L-200,-70 L-180,-70 L-140,-20 Z" fill="white" />
                        <path d="M-160,20 L-200,70 L-180,70 L-140,20 Z" fill="white" />
                        <path d="M-40,-40 L-20,-140 L20,-140 L40,-40 Z" fill="white" opacity="0.9" />
                        <path d="M-40,40 L-20,140 L20,140 L40,40 Z" fill="white" opacity="0.9" />
                        <rect x="-20" y="-50" width="20" height="15" rx="5" fill="white" opacity="0.8" />
                        <rect x="-20" y="35" width="20" height="15" rx="5" fill="white" opacity="0.8" />
                        <line x1="-200" y1="0" x2="-280" y2="0" stroke="white" stroke-width="6" stroke-linecap="round" opacity="0.6" />
                        <line x1="-200" y1="-15" x2="-260" y2="-15" stroke="white" stroke-width="4" stroke-linecap="round" opacity="0.4" />
                        <line x1="-200" y1="15" x2="-260" y2="15" stroke="white" stroke-width="4" stroke-linecap="round" opacity="0.4" />
                    </g>
                </svg>
            </div>
            <h1 class="app-title">Flight Log</h1>
        </header>

        <!-- 日历 -->
        <div class="calendar-card">
            <div class="calendar-header">
                <button class="calendar-nav" onclick="changeMonth(-1)">◀</button>
                <span class="calendar-month" id="calendarMonthLabel"></span>
                <button class="calendar-nav" onclick="changeMonth(1)">▶</button>
            </div>
            <div class="weekdays"><span>一</span><span>二</span><span>三</span><span>四</span><span>五</span><span>六</span><span>日</span></div>
            <div class="calendar-grid" id="calendarGrid"></div>
        </div>

        <!-- 表单 -->
        <div class="form-card">
            <div class="card-title"><span class="dot"></span> 新增记录</div>
            <div class="form-row">
                <div class="form-group">
                    <label><span class="label-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="4" width="18" height="18" rx="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg></span>日期</label>
                    <input type="date" id="recordDate">
                </div>
                <div class="form-group">
                    <label><span class="label-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><polyline points="12,6 12,12 16,14"/></svg></span>时长（分钟）</label>
                    <input type="number" id="recordDuration" min="1" max="480" placeholder="例如：20">
                </div>
                <div class="form-group">
                    <label><span class="label-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20.59 13.41l-7.17 7.17a2 2 0 01-2.83 0L2 12V2h10l8.59 8.59a2 2 0 010 2.82z"/></svg></span>类型</label>
                    <div class="type-toggle-group">
                        <button class="type-btn selected-self" id="typeBtnSelf" onclick="selectType('self')">
                            <span class="type-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M22 2L11 13"/><path d="M22 2L15 22L11 13L2 9L22 2Z"/></svg></span>
                            自慰
                        </button>
                        <button class="type-btn" id="typeBtnSex" onclick="selectType('sex')">
                            <span class="type-icon">
                                <!-- 两个错开相向的红色纸飞机 (scale 0.6 → 与蓝色飞机大小一致) -->
                                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                    <g transform="translate(2,12) scale(0.6)">
                                        <path d="M22 2L11 13"/>
                                        <path d="M22 2L15 22L11 13L2 9L22 2Z"/>
                                    </g>
                                    <g transform="translate(22,10) scale(0.6) rotate(180)">
                                        <path d="M22 2L11 13"/>
                                        <path d="M22 2L15 22L11 13L2 9L22 2Z"/>
                                    </g>
                                </svg>
                            </span>
                            性生活
                        </button>
                    </div>
                </div>
                <div class="form-group">
                    <label><span class="label-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M11 4H4a2 2 0 00-2 2v14a2 2 0 002 2h14a2 2 0 002-2v-7"/><path d="M18.5 2.5a2.121 2.121 0 013 3L12 15l-4 1 1-4 9.5-9.5z"/></svg></span>备注</label>
                    <textarea id="recordNote" rows="2" placeholder="简单备注..."></textarea>
                </div>
            </div>
            <button class="btn-submit" onclick="addRecord()">✅ 保存记录</button>
        </div>

        <!-- 统计 -->
        <div class="stats-grid">
            <div class="stat-card accent-blue">
                <div class="stat-value blue" id="statMonthTotal">0</div>
                <div class="stat-label">本月总次数</div>
                <div class="stat-detail" id="statMonthDetail"></div>
            </div>
            <div class="stat-card accent-rose">
                <div class="stat-value rose" id="statYearTotal">0</div>
                <div class="stat-label">本年总次数</div>
                <div class="stat-detail" id="statYearDetail"></div>
            </div>
            <div class="stat-card accent-teal">
                <div class="stat-value teal" id="statAvgMonthly">0</div>
                <div class="stat-label">平均每月频次</div>
                <div class="stat-detail" id="statAvgDetail"></div>
            </div>
            <div class="stat-card accent-purple">
                <div class="stat-value purple" id="statTotalAll">0</div>
                <div class="stat-label">全部记录数</div>
                <div class="stat-detail" id="statTotalDetail"></div>
            </div>
        </div>

        <!-- 历史记录 -->
        <div class="records-card">
            <div class="records-header"><span class="card-title"><span class="dot"></span> 历史记录</span><span class="records-count" id="recordsCountLabel">共 0 条</span></div>
            <div id="recordsList"><div class="empty-state">📭<p>暂无记录</p></div></div>
        </div>

        <!-- 月度条形图 -->
        <div class="chart-card">
            <div class="chart-header">
                <span class="card-title"><span class="dot"></span> 月度统计</span>
                <div class="chart-year-selector">
                    <button class="chart-year-nav" onclick="changeChartYear(-1)">◀</button>
                    <span id="chartYearLabel">2025</span>
                    <button class="chart-year-nav" onclick="changeChartYear(1)">▶</button>
                </div>
            </div>
            <div class="chart-bars" id="chartBars"></div>
            <div class="chart-legend">
                <span><span class="legend-dot" style="background:var(--type-self)"></span>自慰</span>
                <span><span class="legend-dot" style="background:var(--type-sex)"></span>性生活</span>
            </div>
        </div>

        <!-- 操作按钮 -->
        <div class="actions-row">
            <button class="btn-action primary-outline" onclick="exportData()">
                <span class="action-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15v4a2 2 0 01-2 2H5a2 2 0 01-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg></span>
                导出备份
            </button>
            <button class="btn-action" onclick="document.getElementById('importFileInput').click()">
                <span class="action-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15v4a2 2 0 01-2 2H5a2 2 0 01-2-2v-4"/><polyline points="3 10 8 15 13 10"/><line x1="8" y1="15" x2="8" y2="3"/></svg></span>
                导入恢复
            </button>
            <button class="btn-action danger" onclick="clearAllRecords()">
                <span class="action-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="3 6 5 6 21 6"/><path d="M19 6v14a2 2 0 01-2 2H7a2 2 0 01-2-2V6m3 0V4a2 2 0 012-2h4a2 2 0 012 2v2"/></svg></span>
                清空全部
            </button>
        </div>
        <input type="file" id="importFileInput" accept=".json" onchange="importData(event)">
    </div>

    <script>
        (function() {
            const STORAGE_KEY = 'personal_records_data';
            const BACKUP_KEY = 'personal_records_backup';

            const toastEl = document.getElementById('toast');
            const recordDateInput = document.getElementById('recordDate');
            const recordDurationInput = document.getElementById('recordDuration');
            const recordNoteInput = document.getElementById('recordNote');
            const typeBtnSelf = document.getElementById('typeBtnSelf');
            const typeBtnSex = document.getElementById('typeBtnSex');
            const recordsListEl = document.getElementById('recordsList');
            const recordsCountLabel = document.getElementById('recordsCountLabel');
            const calendarMonthLabel = document.getElementById('calendarMonthLabel');
            const calendarGrid = document.getElementById('calendarGrid');
            const chartYearLabel = document.getElementById('chartYearLabel');
            const chartBarsEl = document.getElementById('chartBars');

            let currentType = 'self';
            let calendarYear = new Date().getFullYear();
            let calendarMonth = new Date().getMonth();
            let chartYear = new Date().getFullYear();

            // 统一图标 SVG
            // 自慰：蓝色单飞机（无缩放）
            const selfIconSVG = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M22 2L11 13"/><path d="M22 2L15 22L11 13L2 9L22 2Z"/></svg>';
            // 性生活：两个错开相向的红色纸飞机，scale 0.6 → 与蓝色飞机大小一致
            const sexIconSVG = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><g transform="translate(2,12) scale(0.6)"><path d="M22 2L11 13"/><path d="M22 2L15 22L11 13L2 9L22 2Z"/></g><g transform="translate(22,10) scale(0.6) rotate(180)"><path d="M22 2L11 13"/><path d="M22 2L15 22L11 13L2 9L22 2Z"/></g></svg>';

            function showToast(msg, type = '', duration = 2200) {
                if (window._toastTimer) clearTimeout(window._toastTimer);
                toastEl.textContent = msg;
                toastEl.className = 'toast ' + type + ' show';
                window._toastTimer = setTimeout(() => { toastEl.classList.remove('show'); }, duration);
            }

            function loadRecords() {
                try {
                    const raw = localStorage.getItem(STORAGE_KEY);
                    if (!raw) return [];
                    return JSON.parse(raw).filter(r => r && r.date && r.type).map(r => ({ ...r, id: r.id || generateId(),
                        duration: r.duration || 0, note: r.note || '' }));
                } catch (e) { return []; }
            }

            function saveRecords(records) { localStorage.setItem(STORAGE_KEY, JSON.stringify(records)); }

            function generateId() { return 'rec_' + Date.now() + '_' + Math.random().toString(36).substr(2, 6); }

            window.selectType = function(type) {
                currentType = type;
                typeBtnSelf.className = type === 'self' ? 'type-btn selected-self' : 'type-btn';
                typeBtnSex.className = type === 'sex' ? 'type-btn selected-sex' : 'type-btn';
            };

            window.addRecord = function() {
                const date = recordDateInput.value.trim();
                const duration = parseInt(recordDurationInput.value, 10);
                const note = recordNoteInput.value.trim();
                if (!date) return showToast('请选择日期', 'warning');
                if (isNaN(duration) || duration < 1) return showToast('请输入有效时长', 'warning');
                if (duration > 480) return showToast('时长不能超过480分钟', 'warning');
                const record = { id: generateId(), date, type: currentType, duration, note, createdAt: new Date()
                        .toISOString() };
                const records = loadRecords();
                records.push(record);
                records.sort((a, b) => b.date.localeCompare(a.date) || (b.createdAt || '').localeCompare(a.createdAt || ''));
                saveRecords(records);
                resetForm();
                renderAll();
                showToast(`✅ 已记录：${date}`, 'success');
            };

            function resetForm() {
                const today = new Date().toISOString().split('T')[0];
                recordDateInput.value = today;
                recordDateInput.max = today;
                recordDurationInput.value = '';
                recordNoteInput.value = '';
                currentType = 'self';
                typeBtnSelf.className = 'type-btn selected-self';
                typeBtnSex.className = 'type-btn';
            }

            window.deleteRecord = function(id) {
                if (!confirm('确定删除这条记录吗？')) return;
                const records = loadRecords().filter(r => r.id !== id);
                saveRecords(records);
                renderAll();
                showToast('🗑️ 记录已删除');
            };

            window.clearAllRecords = function() {
                const records = loadRecords();
                if (!records.length) return showToast('没有记录可清空');
                if (!confirm(`清空全部 ${records.length} 条记录？此操作不可恢复。`)) return;
                if (!confirm('再次确认清空？')) return;
                localStorage.setItem(BACKUP_KEY, JSON.stringify(records));
                saveRecords([]);
                renderAll();
                showToast('已清空（已自动备份）', 'warning');
            };

            window.exportData = function() {
                const records = loadRecords();
                if (!records.length) return showToast('无记录可导出');
                const blob = new Blob([JSON.stringify(records, null, 2)], { type: 'application/json' });
                const url = URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = url;
                a.download = `backup_${new Date().toISOString().split('T')[0]}.json`;
                a.click();
                URL.revokeObjectURL(url);
                showToast(`📤 已导出 ${records.length} 条记录`);
            };

            window.importData = function(e) {
                const file = e.target.files[0];
                e.target.value = '';
                if (!file) return;
                const reader = new FileReader();
                reader.onload = function(ev) {
                    try {
                        const data = JSON.parse(ev.target.result);
                        if (!Array.isArray(data)) throw new Error('格式错误');
                        const valid = data.filter(r => r && r.date && r.type).map(r => ({ id: r.id || generateId(),
                            date: r.date, type: r.type, duration: parseInt(r.duration) || 0, note: r.note || '',
                            createdAt: r.createdAt || new Date().toISOString() }));
                        if (!valid.length) return showToast('无有效记录');
                        if (!confirm(`导入 ${valid.length} 条记录？当前数据将被替换。`)) return;
                        const old = loadRecords();
                        if (old.length) localStorage.setItem(BACKUP_KEY, JSON.stringify(old));
                        valid.sort((a, b) => b.date.localeCompare(a.date));
                        saveRecords(valid);
                        renderAll();
                        showToast(`📥 已导入 ${valid.length} 条记录`, 'success');
                    } catch (err) { showToast('文件解析失败', 'error'); }
                };
                reader.readAsText(file);
            };

            function calculateStats(records) {
                const now = new Date();
                const y = now.getFullYear();
                const m = now.getMonth();
                const cmStr = `${y}-${String(m+1).padStart(2,'0')}`;
                let mSelf = 0,
                    mSex = 0,
                    ySelf = 0,
                    ySex = 0;
                const yearMonths = new Set();
                records.forEach(r => {
                    const [year, month] = r.date.split('-');
                    yearMonths.add(`${year}-${month}`);
                    if (`${year}-${month}` === cmStr) { r.type === 'self' ? mSelf++ : mSex++; }
                    if (year === String(y)) { r.type === 'self' ? ySelf++ : ySex++; }
                });
                const total = records.length;
                const active = yearMonths.size;
                return { monthSelf: mSelf, monthSex: mSex, monthTotal: mSelf + mSex, yearSelf: ySelf, yearSex: ySex,
                    yearTotal: ySelf + ySex, totalAll: total, avgMonthly: active ? (total / active).toFixed(1) : 0,
                    activeMonths: active };
            }

            function renderStats(s) {
                document.getElementById('statMonthTotal').textContent = s.monthTotal;
                document.getElementById('statMonthDetail').innerHTML =
                    `<span class="mini-icon" style="color:var(--type-self)">${selfIconSVG}</span> ${s.monthSelf} · <span class="mini-icon" style="color:var(--type-sex)">${sexIconSVG}</span> ${s.monthSex}`;
                document.getElementById('statYearTotal').textContent = s.yearTotal;
                document.getElementById('statYearDetail').innerHTML =
                    `<span class="mini-icon" style="color:var(--type-self)">${selfIconSVG}</span> ${s.yearSelf} · <span class="mini-icon" style="color:var(--type-sex)">${sexIconSVG}</span> ${s.yearSex}`;
                document.getElementById('statAvgMonthly').textContent = s.avgMonthly;
                document.getElementById('statAvgDetail').textContent = `活跃月份 ${s.activeMonths}`;
                document.getElementById('statTotalAll').textContent = s.totalAll;
                document.getElementById('statTotalDetail').textContent = `全部合计`;
            }

            function renderRecordsList(records) {
                recordsCountLabel.textContent = `共 ${records.length} 条`;
                if (!records.length) { recordsListEl.innerHTML = '<div class="empty-state">📭<p>暂无记录</p></div>'; return; }
                let html = '';
                records.forEach(r => {
                    const isSelf = r.type === 'self';
                    const icon = isSelf ? selfIconSVG : sexIconSVG;
                    html += `<div class="record-item">
                        <div class="record-type-badge ${isSelf?'badge-self':'badge-sex'}">${icon}</div>
                        <div class="record-info">
                            <div class="record-date">${r.date} ${getWeekday(r.date)}</div>
                            <div class="record-meta">
                                <span>${isSelf?'自慰':'性生活'}</span>
                                <span>⏱️ ${r.duration}分钟</span>
                            </div>
                            ${r.note ? `<div style="font-size:0.8rem;color:#555;">💬 ${escapeHtml(r.note)}</div>` : ''}
                        </div>
                        <button class="btn-delete" onclick="deleteRecord('${r.id}')">🗑️</button>
                    </div>`;
                });
                recordsListEl.innerHTML = html;
            }

            function getWeekday(d) { return ['周日', '周一', '周二', '周三', '周四', '周五', '周六'][new Date(d + 'T00:00:00')
                    .getDay()] || ''; }

            function escapeHtml(s) { const div = document.createElement('div');
                div.textContent = s; return div.innerHTML; }

            function renderCalendar() {
                const records = loadRecords();
                const dateCount = {};
                records.forEach(r => { dateCount[r.date] = (dateCount[r.date] || 0) + 1; });
                const year = calendarYear,
                    month = calendarMonth;
                const firstDay = new Date(year, month, 1);
                const startDow = (firstDay.getDay() + 6) % 7;
                const daysInMonth = new Date(year, month + 1, 0).getDate();
                const daysInPrev = new Date(year, month, 0).getDate();
                calendarMonthLabel.textContent = `${year}年${month+1}月`;
                let html = '';
                for (let i = startDow - 1; i >= 0; i--) html +=
                    `<div class="calendar-day other-month">${daysInPrev - i}</div>`;
                const todayStr = new Date().toISOString().split('T')[0];
                for (let d = 1; d <= daysInMonth; d++) {
                    const dateStr =
                        `${year}-${String(month+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
                    const count = dateCount[dateStr] || 0;
                    let cls = 'calendar-day';
                    if (dateStr === todayStr) cls += ' today';
                    if (count > 0) cls += ' has-record';
                    let style = '';
                    if (count > 0) {
                        const maxRings = Math.min(count, 5);
                        const rings = [];
                        for (let i = 1; i <= maxRings; i++) rings.push(
                            `0 0 0 ${i * 4}px rgba(37, 99, 235, ${0.85 - i * 0.13})`);
                        style = `box-shadow: ${rings.join(',')}`;
                    }
                    html += `<div class="${cls}" style="${style}">${d}</div>`;
                }
                const rem = (7 - (startDow + daysInMonth) % 7) % 7;
                for (let d = 1; d <= rem; d++) html += `<div class="calendar-day other-month">${d}</div>`;
                calendarGrid.innerHTML = html;
            }

            window.changeMonth = function(delta) {
                calendarMonth += delta;
                if (calendarMonth < 0) { calendarMonth = 11;
                    calendarYear--; } else if (calendarMonth > 11) { calendarMonth = 0;
                    calendarYear++; }
                renderCalendar();
            };

            function renderChart() {
                const records = loadRecords();
                const year = chartYear;
                chartYearLabel.textContent = year;
                const months = Array.from({ length: 12 }, (_, i) => ({ month: i + 1, self: 0, sex: 0 }));
                records.forEach(r => {
                    const [y, m] = r.date.split('-').map(Number);
                    if (y === year && m) { if (r.type === 'self') months[m - 1].self++;
                        else months[m - 1].sex++; }
                });
                const maxVal = Math.max(1, ...months.map(m => m.self + m.sex));
                let html = '';
                months.forEach(m => {
                    const selfH = (m.self / maxVal) * 130;
                    const sexH = (m.sex / maxVal) * 130;
                    html +=
                        `<div class="chart-month-col"><div class="bar-wrapper"><div class="bar-self" style="height:${selfH}px"></div><div class="bar-sex" style="height:${sexH}px"></div></div><div class="month-label">${m.month}月</div></div>`;
                });
                chartBarsEl.innerHTML = html;
            }

            window.changeChartYear = function(delta) { chartYear += delta;
                renderChart(); };

            function renderAll() {
                const records = loadRecords();
                renderStats(calculateStats(records));
                renderRecordsList(records);
                renderCalendar();
                renderChart();
            }

            function init() {
                const today = new Date().toISOString().split('T')[0];
                recordDateInput.value = today;
                recordDateInput.max = today;
                calendarYear = new Date().getFullYear();
                calendarMonth = new Date().getMonth();
                chartYear = new Date().getFullYear();
                renderAll();
            }

            init();
        })();
    </script>
</body>
</html>
