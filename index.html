<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Flight Log</title>
    <style>
        :root {
            --bg: #f5f5f7;
            --card-bg: #ffffff;
            --text: #1d1d1f;
            --text-secondary: #86868b;
            --border: #e5e5ea;
            --primary: #2563EB;
            --primary-light: #eef2ff;
            --primary-dark: #1d4ed8;
            --type-self: #2563EB;
            --type-self-light: #eef2ff;
            --type-sex: #dc2626;
            --type-sex-light: #fef2f2;
            --type-wet: #059669;
            --type-wet-light: #ecfdf5;
            --type-train: #d97706;
            --type-train-light: #fffbeb;
            --danger: #dc2626;
            --danger-light: #fef2f2;
            
            --shadow-sm: 0 1px 4px rgba(0, 0, 0, 0.03);
            --shadow-md: 0 4px 16px rgba(0, 0, 0, 0.06);
            --shadow-lg: 0 12px 32px rgba(0, 0, 0, 0.08);
            
            --radius-sm: 10px;
            --radius: 16px;
            --radius-lg: 20px;
            --transition: 0.25s cubic-bezier(0.4, 0, 0.2, 1);
            
            /* 统一使用系统无衬线字体 */
            --font-main: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
            font-family: var(--font-main); /* 全局强制统一字体 */
        }

        body {
            background-color: var(--bg);
            color: var(--text);
            line-height: 1.5;
            min-height: 100vh;
            -webkit-font-smoothing: antialiased;
            padding: 16px;
            padding-bottom: 40px;
        }

        .app-container {
            max-width: 600px;
            margin: 0 auto;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        /* ===== 头部 ===== */
        .app-header {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 12px 8px;
            justify-content: center;
            margin-bottom: 4px;
        }
        .app-logo {
            width: 48px;
            height: 48px;
            flex-shrink: 0;
            border-radius: 14px;
            overflow: hidden;
            box-shadow: var(--shadow-md);
        }
        .app-logo svg {
            width: 100%;
            height: 100%;
            display: block;
        }
        .app-title {
            font-size: 2rem;
            font-weight: 700;
            color: var(--text);
            letter-spacing: -0.5px;
        }

        /* ===== 通用组件 ===== */
        .card-title {
            font-size: 0.85rem;
            font-weight: 700;
            color: var(--text-secondary);
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 16px;
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .card-title .dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: var(--primary);
        }

        .label-icon {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 20px;
            height: 20px;
            margin-right: 4px;
            vertical-align: middle;
            flex-shrink: 0;
            color: var(--text-secondary);
        }
        .label-icon svg {
            width: 16px;
            height: 16px;
            display: block;
        }

        /* ===== 日历 ===== */
        .calendar-card {
            background: var(--card-bg);
            border-radius: var(--radius-lg);
            padding: 20px 18px;
            box-shadow: var(--shadow-sm);
            border: 1px solid var(--border);
            text-align: center;
        }
        .calendar-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 16px;
            user-select: none;
        }
        .calendar-month {
            font-weight: 700;
            font-size: 1.15rem;
            color: var(--text);
        }
        .calendar-nav {
            background: none;
            border: none;
            font-size: 1.1rem;
            cursor: pointer;
            padding: 8px 12px;
            border-radius: 10px;
            color: var(--text-secondary);
            outline: none;
            transition: background 0.2s;
        }
        .calendar-nav:active {
            background: var(--bg);
        }
        .weekdays {
            display: grid;
            grid-template-columns: repeat(7, 1fr);
            font-size: 0.7rem;
            font-weight: 700;
            color: var(--text-secondary);
            margin-bottom: 8px;
        }
        .calendar-grid {
            display: grid;
            grid-template-columns: repeat(7, 1fr);
            gap: 6px;
        }
        .calendar-day {
            aspect-ratio: 1/1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            font-size: 0.9rem;
            font-weight: 500;
            border-radius: 50%;
            cursor: pointer;
            color: var(--text);
            background: transparent;
            position: relative;
            padding: 2px 0;
            transition: background 0.2s;
        }
        .calendar-day:hover {
            background: #f0f0f5;
        }
        .calendar-day.other-month {
            color: #d1d1d6;
        }
        .calendar-day.today {
            font-weight: 800;
            color: var(--primary);
            background: var(--primary-light);
        }

        .dot-container {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            align-items: center;
            gap: 3px;
            margin-top: 2px;
            max-width: 80%;
            min-height: 12px;
        }
        .record-dot {
            display: inline-block;
            width: 5px;
            height: 5px;
            border-radius: 50%;
            flex-shrink: 0;
        }

        /* ===== 表单 ===== */
        .form-card {
            background: var(--card-bg);
            border-radius: var(--radius-lg);
            padding: 22px 18px;
            box-shadow: var(--shadow-md);
            border: 1px solid var(--border);
        }
        .form-row {
            display: flex;
            flex-direction: column;
            gap: 16px;
        }
        .form-group {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }
        .form-group label {
            font-size: 0.85rem;
            font-weight: 600;
            color: var(--text-secondary);
            display: flex;
            align-items: center;
            gap: 4px;
        }
        .form-group input,
        .form-group textarea {
            width: 100%;
            padding: 12px 14px;
            border: 1.5px solid var(--border);
            border-radius: var(--radius-sm);
            font-size: 0.95rem;
            background: #fafafa;
            outline: none;
            color: var(--text);
            transition: all var(--transition);
        }
        .form-group textarea {
            resize: vertical;
            min-height: 70px;
            line-height: 1.5;
        }
        .form-group input:focus,
        .form-group textarea:focus {
            border-color: var(--primary);
            background: #fff;
            box-shadow: 0 0 0 4px rgba(37, 99, 235, 0.1);
        }
        
        .type-toggle-group {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }
        .type-btn {
            flex: 1;
            min-width: 70px;
            padding: 12px 8px;
            border: 2px solid var(--border);
            border-radius: var(--radius-sm);
            background: #fafafa;
            cursor: pointer;
            font-size: 0.85rem;
            font-weight: 600;
            color: var(--text-secondary);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            transition: all var(--transition);
            outline: none;
        }
        .type-btn:active {
            transform: scale(0.96);
        }
        .type-btn .type-icon {
            width: 20px;
            height: 20px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
        }
        .type-btn .type-icon svg {
            width: 100%;
            height: 100%;
            stroke: currentColor;
            fill: currentColor;
        }
        
        .type-btn.selected-self { border-color: var(--type-self); background: var(--type-self-light); color: var(--type-self); }
        .type-btn.selected-sex { border-color: var(--type-sex); background: var(--type-sex-light); color: var(--type-sex); }
        .type-btn.selected-wet { border-color: var(--type-wet); background: var(--type-wet-light); color: var(--type-wet); }
        .type-btn.selected-train { border-color: var(--type-train); background: var(--type-train-light); color: var(--type-train); }

        .btn-submit {
            width: 100%;
            padding: 14px;
            background: var(--primary);
            color: #fff;
            border: none;
            border-radius: var(--radius-sm);
            font-weight: 700;
            cursor: pointer;
            margin-top: 18px;
            font-size: 1rem;
            outline: none;
            transition: all var(--transition);
            box-shadow: 0 4px 12px rgba(37, 99, 235, 0.2);
        }
        .btn-submit:active {
            transform: scale(0.98);
            background: var(--primary-dark);
        }

        /* ===== 统计 ===== */
        .stats-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
        }
        .stat-card {
            background: var(--card-bg);
            border-radius: var(--radius);
            padding: 16px 14px;
            border: 1px solid var(--border);
            text-align: center;
            box-shadow: var(--shadow-sm);
        }
        .stat-value {
            font-size: 2.2rem;
            font-weight: 800;
            letter-spacing: -1px;
            line-height: 1.1;
        }
        .stat-label {
            font-size: 0.75rem;
            color: var(--text-secondary);
            font-weight: 600;
            margin-top: 4px;
        }
        .stat-detail {
            font-size: 0.75rem;
            color: var(--text-secondary);
            margin-top: 6px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 4px;
            flex-wrap: wrap;
        }
        .stat-detail .mini-icon {
            width: 14px;
            height: 14px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
        }
        .stat-detail .mini-icon svg {
            width: 100%;
            height: 100%;
            stroke: currentColor;
            fill: currentColor;
        }
        
        .stat-card.accent-blue { border-left: 3px solid var(--type-self); background: #fafcfd; }
        .stat-card.accent-rose { border-left: 3px solid var(--type-sex); background: #fdfaf9; }
        .stat-card.accent-teal { border-left: 3px solid var(--type-wet); background: #f9fcfa; }
        .stat-card.accent-yellow { border-left: 3px solid var(--type-train); background: var(--type-train-light); }

        .stat-value.blue { color: var(--type-self); }
        .stat-value.rose { color: var(--type-sex); }
        .stat-value.teal { color: var(--type-wet); }
        .stat-value.yellow { color: var(--type-train); }

        /* ===== 天数记录 ===== */
        .day-record-card {
            background: var(--card-bg);
            border-radius: var(--radius-lg);
            padding: 20px 18px;
            box-shadow: var(--shadow-sm);
            border: 1px solid var(--border);
        }
        .day-record-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
        }
        .day-record-item {
            background: var(--primary-light);
            border: 1px solid #dbe4ff;
            border-radius: var(--radius);
            padding: 16px 12px;
            text-align: center;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }
        .day-record-item.secondary {
            background: #fafafa;
            border-color: var(--border);
        }
        
        /* 天数记录数字与单位对齐 */
        .day-record-value {
            font-size: 2.2rem;
            line-height: 1;
            font-weight: 800;
            color: var(--primary);
            display: flex;
            align-items: baseline;
            justify-content: center;
        }
        .day-record-value .unit {
            font-size: 1rem;
            font-weight: 600;
            margin-left: 4px;
            color: var(--primary);
            opacity: 0.8;
        }

        .day-record-item.secondary .day-record-value {
            color: var(--text);
            font-size: 1.4rem;
            min-height: 36px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .day-record-label {
            margin-top: 8px;
            font-size: 0.8rem;
            font-weight: 700;
            color: var(--text);
        }
        .day-record-detail {
            margin-top: 4px;
            font-size: 0.75rem;
            color: var(--text-secondary);
        }

        /* ===== 历史记录 ===== */
        .records-card {
            background: var(--card-bg);
            border-radius: var(--radius-lg);
            padding: 20px 18px;
            box-shadow: var(--shadow-sm);
            border: 1px solid var(--border);
        }
        .records-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
        }
        .records-count {
            font-size: 0.8rem;
            color: var(--text-secondary);
            font-weight: 600;
        }
        .empty-state {
            text-align: center;
            padding: 40px 16px;
            color: var(--text-secondary);
            font-size: 0.95rem;
        }
        .record-item {
            display: flex;
            align-items: flex-start;
            gap: 14px;
            padding: 14px 10px;
            border-bottom: 1px solid #f0f0f3;
            cursor: default;
            user-select: none;
            -webkit-touch-callout: none;
            transition: all 0.2s;
            border-radius: var(--radius-sm);
            position: relative;
            touch-action: manipulation;
        }
        .record-item:last-child {
            border-bottom: none;
        }
        .record-item.long-pressing {
            background: var(--danger-light);
            transform: scale(0.98);
        }

        .record-type-badge {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
        }
        .record-type-badge svg {
            width: 22px;
            height: 22px;
            stroke: currentColor;
            fill: currentColor;
        }
        .badge-self { background: var(--type-self-light); color: var(--type-self); }
        .badge-sex { background: var(--type-sex-light); color: var(--type-sex); }
        .badge-wet { background: var(--type-wet-light); color: var(--type-wet); }
        .badge-train { background: var(--type-train-light); color: var(--type-train); }
        
        .record-info {
            flex: 1;
            min-width: 0;
            padding-top: 2px;
        }
        .record-info .record-date {
            font-weight: 700;
            font-size: 0.95rem;
            color: var(--text);
        }
        .record-meta {
            font-size: 0.8rem;
            color: var(--text-secondary);
            display: flex;
            gap: 10px;
            align-items: center;
            margin-top: 4px;
            flex-wrap: wrap;
        }
        .record-note {
            font-size: 0.85rem;
            color: #555;
            margin-top: 6px;
            background: #f9f9fb;
            padding: 6px 10px;
            border-radius: 6px;
            word-break: break-all;
        }

        /* ===== 分页 ===== */
        .pagination-container {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            padding: 16px 8px 4px;
            border-top: 1px solid var(--border);
            margin-top: 8px;
            flex-wrap: wrap;
        }
        .page-btn {
            background: #fff;
            border: 1.5px solid var(--border);
            border-radius: var(--radius-sm);
            padding: 8px 16px;
            font-size: 0.9rem;
            font-weight: 600;
            color: var(--text-secondary);
            cursor: pointer;
            transition: all var(--transition);
            min-width: 48px;
            min-height: 44px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            outline: none;
        }
        .page-btn:active:not(:disabled) {
            transform: scale(0.95);
            background: var(--border);
        }
        .page-btn:disabled {
            opacity: 0.3;
            pointer-events: none;
        }
        .page-btn:not(:disabled):hover {
            background: var(--primary-light);
            border-color: var(--primary);
            color: var(--primary);
        }
        .page-info {
            font-size: 0.9rem;
            font-weight: 600;
            color: var(--text-secondary);
            min-width: 60px;
            text-align: center;
        }
        .page-info .current-page {
            color: var(--text);
            font-weight: 800;
        }
        
        /* ===== 图表 ===== */
        .chart-card {
            background: var(--card-bg);
            border-radius: var(--radius-lg);
            padding: 20px 18px;
            border: 1px solid var(--border);
            box-shadow: var(--shadow-sm);
        }
        .chart-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            flex-wrap: wrap;
            gap: 10px;
        }
        .chart-year-selector {
            display: flex;
            align-items: center;
            gap: 4px;
            font-weight: 700;
            flex-wrap: wrap;
            justify-content: flex-end;
        }
        .chart-year-nav {
            background: none;
            border: 1px solid var(--border);
            border-radius: 6px;
            padding: 4px 8px;
            cursor: pointer;
            font-size: 0.8rem;
            color: var(--text-secondary);
            transition: all 0.15s;
            line-height: 1.4;
            min-width: 30px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            outline: none;
        }
        .chart-year-nav:active {
            background: var(--border);
        }
        .chart-year-nav.disabled {
            opacity: 0.3;
            pointer-events: none;
        }
        .selector-label {
            font-size: 0.8rem;
            font-weight: 700;
            color: var(--text);
            padding: 0 2px;
            min-width: 44px;
            text-align: center;
        }
        .selector-divider {
            color: var(--border);
            font-weight: 300;
            margin: 0 4px;
        }
        .half-group, .year-group {
            display: flex;
            align-items: center;
            gap: 2px;
        }
        .chart-bars {
            display: flex;
            justify-content: space-around;
            align-items: flex-end;
            height: 180px;
            gap: 4px;
        }
        .chart-month-col {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 4px;
            height: 100%;
            justify-content: flex-end;
        }
        .bar-wrapper {
            display: flex;
            gap: 3px;
            align-items: flex-end;
            height: 140px;
            width: 100%;
            justify-content: center;
        }
        .bar-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-end;
            height: 100%;
            gap: 2px;
            width: 12px;
        }
        .bar-count {
            font-size: 0.65rem;
            line-height: 1;
            font-weight: 700;
            color: var(--text-secondary);
        }
        .bar-self, .bar-sex, .bar-wet, .bar-train {
            width: 100%;
            border-radius: 4px 4px 0 0;
            min-height: 2px;
            transition: height 0.3s ease;
        }
        .bar-self { background: var(--type-self); }
        .bar-sex { background: var(--type-sex); }
        .bar-wet { background: var(--type-wet); }
        .bar-train { background: var(--type-train); }
        
        .month-label {
            font-size: 0.75rem;
            color: var(--text-secondary);
            font-weight: 600;
        }
        .chart-legend {
            display: flex;
            justify-content: center;
            gap: 16px;
            margin-top: 16px;
            font-size: 0.75rem;
            color: var(--text-secondary);
            flex-wrap: wrap;
            font-weight: 600;
        }
        .legend-dot {
            display: inline-block;
            width: 10px;
            height: 10px;
            border-radius: 3px;
            margin-right: 6px;
            vertical-align: middle;
        }

        /* ===== 操作按钮 ===== */
        .actions-row {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            margin-bottom: 20px;
        }
        .btn-action {
            flex: 1;
            padding: 12px 10px;
            border: 1.5px solid var(--border);
            border-radius: var(--radius-sm);
            background: var(--card-bg);
            cursor: pointer;
            font-size: 0.85rem;
            font-weight: 600;
            color: var(--text-secondary);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            transition: all var(--transition);
            position: relative;
            overflow: hidden;
            min-height: 52px;
            outline: none;
        }
        .btn-action:active {
            transform: scale(0.96);
        }
        .btn-action.danger {
            border-color: #fecaca;
            color: var(--danger);
            background: var(--danger-light);
        }
        .btn-action.primary-outline {
            border-color: var(--primary);
            color: var(--primary);
        }
        .btn-action .action-icon {
            width: 18px;
            height: 18px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
        }
        .btn-action .action-icon svg {
            width: 100%;
            height: 100%;
            stroke: currentColor;
            stroke-width: 2;
            fill: none;
        }
        .btn-action .file-input-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            opacity: 0;
            cursor: pointer;
            font-size: 0;
            -webkit-appearance: none;
            appearance: none;
        }

        /* ===== Toast ===== */
        .toast {
            position: fixed;
            top: 24px;
            left: 50%;
            transform: translateX(-50%) translateY(-100px);
            background: rgba(29, 29, 31, 0.95);
            color: #fff;
            padding: 12px 24px;
            border-radius: 100px;
            font-size: 0.9rem;
            z-index: 9999;
            transition: transform 0.4s cubic-bezier(0.4, 0, 0.2, 1);
            max-width: 90%;
            text-align: center;
            pointer-events: none;
            box-shadow: var(--shadow-lg);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
        }
        .toast.show {
            transform: translateX(-50%) translateY(0);
        }

        /* ===== 响应式 ===== */
        @media (min-width: 480px) {
            .form-row {
                flex-direction: row;
                flex-wrap: wrap;
            }

        // ==========================================
        // 1. IndexedDB 封装与全局状态
        // ==========================================
        const DB_NAME = 'FlightLogDB';
        const STORE_NAME = 'records';
        let db = null;
        let appRecords = []; // 内存缓存，用于极速渲染

        function initDB() {
            return new Promise((resolve, reject) => {
                const request = indexedDB.open(DB_NAME, 1);
                request.onerror = (e) => reject(e.target.error);
                request.onsuccess = (e) => {
                    db = e.target.result;
                    resolve(db);
                };
                request.onupgradeneeded = (e) => {
                    const dbInstance = e.target.result;
                    if (!dbInstance.objectStoreNames.contains(STORE_NAME)) {
                        const store = dbInstance.createObjectStore(STORE_NAME, { keyPath: 'id' });
                        store.createIndex('date', 'date', { unique: false });
                    }
                };
            });
        }

        function dbGetAll() {
            return new Promise((resolve, reject) => {
                if (!db) return resolve([]);
                const transaction = db.transaction([STORE_NAME], 'readonly');
                const store = transaction.objectStore(STORE_NAME);
                const request = store.getAll();
                request.onsuccess = () => resolve(request.result);
                request.onerror = (e) => reject(e.target.error);
            });
        }

        function dbPut(record) {
            return new Promise((resolve, reject) => {
                const transaction = db.transaction([STORE_NAME], 'readwrite');
                const store = transaction.objectStore(STORE_NAME);
                const request = store.put(record);
                request.onsuccess = () => resolve();
                request.onerror = (e) => reject(e.target.error);
            });
        }

        function dbDelete(id) {
            return new Promise((resolve, reject) => {
                const transaction = db.transaction([STORE_NAME], 'readwrite');
                const store = transaction.objectStore(STORE_NAME);
                const request = store.delete(id);
                request.onsuccess = () => resolve();
                request.onerror = (e) => reject(e.target.error);
            });
        }

        function dbClear() {
            return new Promise((resolve, reject) => {
                const transaction = db.transaction([STORE_NAME], 'readwrite');
                const store = transaction.objectStore(STORE_NAME);
                const request = store.clear();
                request.onsuccess = () => resolve();
                request.onerror = (e) => reject(e.target.error);
            });

        const trainIconSVG = '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256"><path d="M0 0h256v256H0z" fill="none" /><path d="M104 192a8 8 0 0 1-8 8H80a8 8 0 0 1 0-16h16a8 8 0 0 1 8 8m72-8h-16a8 8 0 0 0 0 16h16a8 8 0 0 0 0-16m-76-48a12 12 0 1 0-12-12a12 12 0 0 0 12 12m56 0a12 12 0 1 0-12-12a12 12 0 0 0 12 12m88.39-13.88A16 16 0 0 1 232 128h-32v32a40 40 0 0 1-24 72H80a40 40 0 0 1-24-72v-32H24a16 16 0 0 1-15.69-19a56.13 56.13 0 0 1 54.91-45h1.64A55.83 55.83 0 0 1 48 24a8 8 0 0 1 16 0a40 40 0 0 0 40 40h48a40 40 0 0 0 40-40a8 8 0 0 1 16 0a55.83 55.83 0 0 1-16.86 40h1.64a56.13 56.13 0 0 1 54.91 45a15.82 15.82 0 0 1-3.3 13.12M72 152.8a40.6 40.6 0 0 1 8-.8h96a40.6 40.6 0 0 1 8 .8V104a24 24 0 0 0-24-24H96a24 24 0 0 0-24 24ZM56 112v-8a39.8 39.8 0 0 1 8-24h-.8A40.09 40.09 0 0 0 24 112Zm144 80a24 24 0 0 0-24-24H80a24 24 0 0 0 0 48h96a24 24 0 0 0 24-24m32-80a40.08 40.08 0 0 0-39.2-32h-.8a39.8 39.8 0 0 1 8 24v8Z" /></svg>';

        // ==========================================
        // 3. 辅助函数与通用逻辑
        // ==========================================
        function showToast(msg, duration = 2200) {
            if (window._toastTimer) clearTimeout(window._toastTimer);
            toastEl.textContent = msg;
            toastEl.classList.add('show');
            if (duration > 0) {
                window._toastTimer = setTimeout(() => toastEl.classList.remove('show'), duration);
            }
        }

        function hideToast() {
            toastEl.classList.remove('show');
            if (window._toastTimer) clearTimeout(window._toastTimer);
        }

        function generateId() { 
            return 'rec_' + Date.now() + '_' + Math.random().toString(36).substr(2, 6); 
        }

        function getWeekday(d) { 
            return ['周日', '周一', '周二', '周三', '周四', '周五', '周六'][new Date(d + 'T00:00:00').getDay()] || ''; 
        }

        function escapeHtml(s) { 
            const div = document.createElement('div');
            div.textContent = s; 
            return div.innerHTML; 
        }

        function resetPagination() { currentPage = 1; }
        function getTotalPages(total) { return Math.max(1, Math.ceil(total / PAGE_SIZE)); }

        // ==========================================
        // 4. 业务逻辑 (增删改查)
        // ==========================================
        window.selectType = function(type) {
            currentType = type;
            typeBtnSelf.className = type === 'self' ? 'type-btn selected-self' : 'type-btn';
            typeBtnSex.className = type === 'sex' ? 'type-btn selected-sex' : 'type-btn';
            typeBtnWet.className = type === 'wet' ? 'type-btn selected-wet' : 'type-btn';
            typeBtnTrain.className = type === 'train' ? 'type-btn selected-train' : 'type-btn';
        };

        window.addRecord = async function() {
            const date = recordDateInput.value.trim();
            const rawDuration = recordDurationInput.value.trim();
            const note = recordNoteInput.value.trim();
            if (!date) return showToast('请选择日期');

            let duration = 0;
            if (rawDuration !== '') {
                const parsed = parseInt(rawDuration, 10);
                if (isNaN(parsed) || parsed < 0) return showToast('时长请输入有效数字');
                if (parsed > 480) return showToast('时长不能超过480分钟');
                duration = parsed;
            }

            const record = { id: generateId(), date, type: currentType, duration, note, createdAt: new Date().toISOString() };
            
            // 写入 DB
            try {
                await dbPut(record);
                appRecords.push(record);
                appRecords.sort((a, b) => b.date.localeCompare(a.date) || (b.createdAt || '').localeCompare(a.createdAt || ''));
                
                resetForm();
                resetPagination();
                renderAll();
                showToast(`✅ 已记录：${date}`);
            } catch (err) {
                showToast('保存失败，请重试');
                console.error(err);
            }
        };

        function resetForm() {
            const today = new Date().toISOString().split('T')[0];
            recordDateInput.value = today;
            recordDateInput.max = today;
            recordDurationInput.value = '';
            recordNoteInput.value = '';
            window.selectType('self');
        }

        window.deleteRecord = async function(id, skipConfirm = false) {
            if (!skipConfirm && !confirm('确定删除这条记录吗？')) return;
            try {
                await dbDelete(id);
                appRecords = appRecords.filter(r => r.id !== id);
                const totalPages = getTotalPages(appRecords.length);
                if (currentPage > totalPages && currentPage > 1) currentPage = totalPages;
                
                renderAll();
                showToast('🗑️ 记录已删除');
            } catch (err) {
                showToast('删除失败');
            }
        };

        window.clearAllRecords = async function() {
            if (!appRecords.length) return showToast('没有记录可清空');
            if (!confirm(`清空全部 ${appRecords.length} 条记录？此操作不可恢复。`)) return;
            if (!confirm('再次确认清空？')) return;
            
            try {
                // 自动备份到 localStorage 以防误触
                localStorage.setItem('auto_backup_' + Date.now(), JSON.stringify(appRecords));
                await dbClear();
                appRecords = [];
                resetPagination();
                renderAll();
                showToast('已清空（已自动备份到本地）');
            } catch (err) {
                showToast('清空失败');
            }
        };

        window.exportData = function() {
            if (!appRecords.length) return showToast('无记录可导出');
            const blob = new Blob([JSON.stringify(appRecords, null, 2)], { type: 'application/json' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = `flightlog_backup_${new Date().toISOString().split('T')[0]}.json`;
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
            URL.revokeObjectURL(url);
            showToast(`📤 已导出 ${appRecords.length} 条记录`);
        };

        window.importData = async function(e) {
            const file = e.target.files[0];
            e.target.value = '';
            if (!file) return;
            
            const reader = new FileReader();
            reader.onload = async function(ev) {
                try {
                    const data = JSON.parse(ev.target.result);
                    if (!Array.isArray(data)) throw new Error('格式错误');
                    const valid = data.filter(r => r && r.date && r.type).map(r => ({
                        id: r.id || generateId(),
                        date: r.date, type: r.type, 
                        duration: parseInt(r.duration) || 0, 
                        note: r.note || '',
                        createdAt: r.createdAt || new Date().toISOString()
                    }));
                    
                    if (!valid.length) return showToast('无有效记录');
                    if (!confirm(`导入 ${valid.length} 条记录？当前数据将被覆盖。`)) return;
                    
                    // 简单备份当前数据
                    if (appRecords.length) localStorage.setItem('auto_backup_' + Date.now(), JSON.stringify(appRecords));
                    
                    await dbClear();
                    for (let r of valid) { await dbPut(r); }
                    
                    appRecords = valid.sort((a, b) => b.date.localeCompare(a.date));
                    resetPagination();
                    renderAll();
                    showToast(`📥 已导入 ${valid.length} 条记录`);
                } catch (err) {
                    showToast('文件解析失败');
                }
            };
            reader.readAsText(file);
        };

        // ==========================================
        // 5. 渲染逻辑
        // ==========================================
        function getPageData(records, page) {
            const start = (page - 1) * PAGE_SIZE;
            return records.slice(start, start + PAGE_SIZE);
        }

        function renderStats(records) {
            const now = new Date();
            const y = now.getFullYear();
            const m = now.getMonth();
            const cmStr = `${y}-${String(m+1).padStart(2,'0')}`;
            let mSelf = 0, mSex = 0, mWet = 0;
            let ySelf = 0, ySex = 0, yWet = 0;
            const yearMonths = new Set();
            
            records.forEach(r => {
                const [year, month] = r.date.split('-');
                if (r.type !== 'train') yearMonths.add(`${year}-${month}`);
                if (r.type === 'self') {
                    if (`${year}-${month}` === cmStr) mSelf++;
                    if (year === String(y)) ySelf++;
                } else if (r.type === 'sex') {
                    if (`${year}-${month}` === cmStr) mSex++;
                    if (year === String(y)) ySex++;
                } else if (r.type === 'wet') {
                    if (`${year}-${month}` === cmStr) mWet++;
                    if (year === String(y)) yWet++;
                }
            });
            
            const totalAll = records.filter(r => r.type !== 'train').length;
            const active = yearMonths.size;
            
            document.getElementById('statMonthTotal').textContent = mSelf + mSex + mWet;
            document.getElementById('statMonthDetail').innerHTML =
                `<span class="mini-icon" style="color:var(--type-self)">${selfIconSVG}</span> ${mSelf} · ` +
                `<span class="mini-icon" style="color:var(--type-sex)">${sexIconSVG}</span> ${mSex} · ` +
                `<span class="mini-icon" style="color:var(--type-wet)">${wetIconSVG}</span> ${mWet}`;

            document.getElementById('statYearTotal').textContent = ySelf + ySex + yWet;
            document.getElementById('statYearDetail').innerHTML =
                `<span class="mini-icon" style="color:var(--type-self)">${selfIconSVG}</span> ${ySelf} · ` +
                `<span class="mini-icon" style="color:var(--type-sex)">${sexIconSVG}</span> ${ySex} · ` +
                `<span class="mini-icon" style="color:var(--type-wet)">${wetIconSVG}</span> ${yWet}`;

            document.getElementById('statAvgMonthly').textContent = active ? (totalAll / active).toFixed(1) : 0;
            document.getElementById('statAvgDetail').textContent = `活跃月份 ${active}`;
            document.getElementById('statTotalAll').textContent = totalAll;
            document.getElementById('statTotalDetail').textContent = `全部合计`;
        }

        function renderDayRecord(records) {
            const relevant = records
                .filter(r => r.type === 'self' || r.type === 'sex')
                .sort((a, b) => b.date.localeCompare(a.date) || (b.createdAt || '').localeCompare(a.createdAt || ''));

            if (!relevant.length) {
                daysSinceLastRecordEl.textContent = '—';
                lastRecordDateEl.textContent = '暂无相关记录';
                lastRecordTypeEl.textContent = '—';
                lastRecordTypeDateEl.textContent = '暂无相关记录';
                return;
            }

            const latest = relevant[0];
            const lastDate = new Date(latest.date + 'T00:00:00');
            const today = new Date();
            const todayStart = new Date(today.getFullYear(), today.getMonth(), today.getDate());
            const diffDays = Math.max(0, Math.floor((todayStart - lastDate) / 86400000));
            const typeLabel = latest.type === 'self' ? '自慰' : '性交';

            // 使用 HTML 分离数字和 day 单位，搭配 CSS 基线对齐，使 UI 更自然
            daysSinceLastRecordEl.innerHTML = `${diffDays}<span class="unit">day</span>`;
            lastRecordDateEl.textContent = `上一次：${latest.date}`;
            lastRecordTypeEl.textContent = typeLabel;
            lastRecordTypeDateEl.textContent = latest.date;
        }

        function renderCalendar(records) {
            const dateCount = { self: {}, sex: {}, wet: {}, train: {} };
            records.forEach(r => {
                if (dateCount[r.type]) {
                    dateCount[r.type][r.date] = (dateCount[r.type][r.date] || 0) + 1;
                }
            });

            const year = calendarYear, month = calendarMonth;
            const firstDay = new Date(year, month, 1);
            const startDow = (firstDay.getDay() + 6) % 7;
            const daysInMonth = new Date(year, month + 1, 0).getDate();
            const daysInPrev = new Date(year, month, 0).getDate();
            
            calendarMonthLabel.textContent = `${year}年${month+1}月`;
            let html = '';
            
            // 上月尾部
            for (let i = startDow - 1; i >= 0; i--) {
                const prevDate = new Date(year, month - 1, daysInPrev - i);
                const dateStr = prevDate.toISOString().split('T')[0];
                html += `<div class="calendar-day other-month" onclick="setDate('${dateStr}')">${daysInPrev - i}</div>`;
            }
            
            const todayStr = new Date().toISOString().split('T')[0];
            const typeColors = { self: 'var(--type-self)', sex: 'var(--type-sex)', wet: 'var(--type-wet)', train: 'var(--type-train)' };

            // 本月
            for (let d = 1; d <= daysInMonth; d++) {
                const dateStr = `${year}-${String(month+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
                
                let cls = 'calendar-day';
                if (dateStr === todayStr) cls += ' today';

                let dotHtml = '';
                const groups = [
                    { type: 'self', count: Math.min(dateCount.self[dateStr] || 0, 5) },
                    { type: 'sex', count: Math.min(dateCount.sex[dateStr] || 0, 5) },
                    { type: 'wet', count: Math.min(dateCount.wet[dateStr] || 0, 5) },
                    { type: 'train', count: Math.min(dateCount.train[dateStr] || 0, 5) }
                ];
                const totalDots = groups.reduce((s, g) => s + g.count, 0);
                
                if (totalDots > 0) {
                    let dotsMarkup = '';
                    groups.forEach(g => {
                        if (g.count === 0) return;
                        for (let i = 0; i < g.count; i++) {
                            dotsMarkup += `<span class="record-dot" style="background:${typeColors[g.type]};"></span>`;
                        }
                    });
                    dotHtml = `<div class="dot-container">${dotsMarkup}</div>`;
                }

                html += `<div class="${cls}" onclick="setDate('${dateStr}')">${d}${dotHtml}</div>`;
            }
            
            // 下月头部
            const rem = (7 - (startDow + daysInMonth) % 7) % 7;
            for (let d = 1; d <= rem; d++) {
                const nextDate = new Date(year, month + 1, d);
                const dateStr = nextDate.toISOString().split('T')[0];
                html += `<div class="calendar-day other-month" onclick="setDate('${dateStr}')">${d}</div>`;
            }
            
            calendarGrid.innerHTML = html;
        }

        function renderChart(records) {
            chartYearLabel.textContent = chartYear;
            const startMonth = halfYear === 0 ? 1 : 7;
            const endMonth = halfYear === 0 ? 6 : 12;
            halfYearLabel.textContent = halfYear === 0 ? '1-6月' : '7-12月';

            document.getElementById('halfPrevBtn').classList.toggle('disabled', halfYear === 0);
            document.getElementById('halfNextBtn').classList.toggle('disabled', halfYear === 1);

            const months = [];
            for (let m = startMonth; m <= endMonth; m++) {
                months.push({ month: m, self: 0, sex: 0, wet: 0, train: 0 });
            }

            records.forEach(r => {
                const [y, m] = r.date.split('-').map(Number);
                if (y === chartYear && m >= startMonth && m <= endMonth) {
                    const idx = m - startMonth;
                    if (months[idx][r.type] !== undefined) months[idx][r.type]++;
                }
            });

            const maxVal = Math.max(1, ...months.map(m => m.self + m.sex + m.wet + m.train));
            let html = '';
            months.forEach(m => {
                const hSelf = (m.self / maxVal) * 130;
                const hSex = (m.sex / maxVal) * 130;
                const hWet = (m.wet / maxVal) * 130;
                const hTrain = (m.train / maxVal) * 130;
                html += `<div class="chart-month-col">
                    <div class="bar-wrapper">
                        <div class="bar-item"><span class="bar-count">${m.self}</span><div class="bar-self" style="height:${hSelf}px"></div></div>
                        <div class="bar-item"><span class="bar-count">${m.sex}</span><div class="bar-sex" style="height:${hSex}px"></div></div>
                        <div class="bar-item"><span class="bar-count">${m.wet}</span><div class="bar-wet" style="height:${hWet}px"></div></div>
                        <div class="bar-item"><span class="bar-count">${m.train}</span><div class="bar-train" style="height:${hTrain}px"></div></div>
                    </div>
                    <div class="month-label">${m.month}月</div>
                </div>`;
            });
            chartBarsEl.innerHTML = html;
        }

        function bindLongPress(element) {
            let timer = null;
            let isPressing = false;
            const id = element.dataset.id;
            if (!id) return;

            function startPress(e) {
                if (e.type === 'mousedown' && e.button !== 0) return;
                if (isPressing) return;
                isPressing = true;
                element.classList.add('long-pressing');
                showToast('继续长按 3 秒删除', 0);
                timer = setTimeout(() => {
                    if (isPressing) {
                        window.deleteRecord(id, true);
                        isPressing = false;
                        timer = null;
                        hideToast();
                    }
                }, 3000); // 修改为 3000ms (3s)
            }

            function cancelPress() {
                if (timer) { clearTimeout(timer); timer = null; }
                if (isPressing) {
                    isPressing = false;
                    element.classList.remove('long-pressing');
                    hideToast();
                }
            }

            element.addEventListener('touchstart', startPress, { passive: true });
            element.addEventListener('touchend', cancelPress, { passive: true });
            element.addEventListener('touchcancel', cancelPress, { passive: true });
            element.addEventListener('touchmove', cancelPress, { passive: true });
            element.addEventListener('mousedown', startPress);
            element.addEventListener('mouseup', cancelPress);
            element.addEventListener('mouseleave', cancelPress);
        }

        function renderRecordsList(records, totalCount) {
            recordsCountLabel.textContent = `共 ${totalCount} 条`;
            if (!records.length) {
                recordsListEl.innerHTML = '<div class="empty-state">📭<p>暂无记录</p></div>';
                return;
            }

            let html = '';
            records.forEach(r => {
                let badgeClass = 'badge-self', label = '自慰', icon = selfIconSVG;
                if (r.type === 'sex') { badgeClass = 'badge-sex'; label = '性交'; icon = sexIconSVG; }
                else if (r.type === 'wet') { badgeClass = 'badge-wet'; label = '遗精'; icon = wetIconSVG; }
                else if (r.type === 'train') { badgeClass = 'badge-train'; label = '牛牛训练'; icon = trainIconSVG; }

                const durationDisplay = r.duration > 0 ? `${r.duration} 分钟` : '';

                html += `<div class="record-item" data-id="${r.id}">
                    <div class="record-type-badge ${badgeClass}">${icon}</div>
                    <div class="record-info">
                        <div class="record-date">${r.date} <span style="font-size:0.8rem;color:var(--text-secondary);font-weight:500;">${getWeekday(r.date)}</span></div>
                        <div class="record-meta">
                            <span>${label}</span>
                            ${durationDisplay ? `<span>⏱ ${durationDisplay}</span>` : ''}
                        </div>
                        ${r.note ? `<div class="record-note">💬 ${escapeHtml(r.note)}</div>` : ''}
                    </div>
                </div>`;
            });
            recordsListEl.innerHTML = html;
            document.querySelectorAll('.record-item').forEach(bindLongPress);
        }

        function renderPagination(totalRecords) {
            const totalPages = getTotalPages(totalRecords);
            const current = Math.min(currentPage, totalPages);
            
            pageInfoCurrent.textContent = current;
            pageInfoTotal.textContent = totalPages;
            prevPageBtn.disabled = current <= 1;
            nextPageBtn.disabled = current >= totalPages;
            
            paginationContainer.style.display = totalRecords === 0 ? 'none' : 'flex';
        }

        function renderAll() {
            const totalRecords = appRecords.length;
            const totalPages = getTotalPages(totalRecords);
            if (currentPage > totalPages) currentPage = Math.max(1, totalPages);
            if (currentPage < 1) currentPage = 1;

            const pageRecords = getPageData(appRecords, currentPage);

            renderStats(appRecords);
            renderDayRecord(appRecords);
            renderCalendar(appRecords);
            renderRecordsList(pageRecords, totalRecords);
            renderPagination(totalRecords);
            renderChart(appRecords);
        }

        // 翻页逻辑
        paginationContainer.addEventListener('click', function(e) {
            const btn = e.target.closest('button');
            if (!btn) return;
            if (btn.id === 'prevPageBtn') { currentPage--; renderAll(); scrollToRecords(); }
            else if (btn.id === 'nextPageBtn') { currentPage++; renderAll(); scrollToRecords(); }
        });

        function scrollToRecords() {
            const card = document.querySelector('.records-card');
            if (card) card.scrollIntoView({ behavior: 'smooth', block: 'start' });
        }

        window.changeMonth = function(delta) {
            calendarMonth += delta;
            if (calendarMonth < 0) { calendarMonth = 11; calendarYear--; }
            else if (calendarMonth > 11) { calendarMonth = 0; calendarYear++; }
            renderCalendar(appRecords);
        };

        window.setDate = function(dateStr) {
            recordDateInput.value = dateStr;
            document.querySelector('.form-card').scrollIntoView({ behavior: 'smooth' });
        };

        window.changeHalfYear = function(delta) {
            const newHalf = halfYear + delta;
            if (newHalf >= 0 && newHalf <= 1) {
                halfYear = newHalf;
                renderChart(appRecords);
            }
        };

        window.changeChartYear = function(delta) {
            chartYear += delta;
            renderChart(appRecords);
        };

        // ==========================================
        // 6. 启动应用
        // ==========================================
        async function initApp() {
            try {
                await initDB();
                appRecords = await dbGetAll();
                appRecords.sort((a, b) => b.date.localeCompare(a.date) || (b.createdAt || '').localeCompare(a.createdAt || ''));
            } catch (err) {
                console.error("DB Init Error:", err);
                showToast("本地数据库初始化失败，请刷新重试");
            }
            
            const today = new Date().toISOString().split('T')[0];
            recordDateInput.value = today;
            recordDateInput.max = today;
            calendarYear = new Date().getFullYear();
            calendarMonth = new Date().getMonth();
            chartYear = new Date().getFullYear();
            halfYear = (new Date().getMonth() + 1) <= 6 ? 0 : 1;

            resetPagination();
            renderAll();
        }

        // 页面加载完毕后启动
        document.addEventListener('DOMContentLoaded', initApp);
    </script>
</body>
</html>
